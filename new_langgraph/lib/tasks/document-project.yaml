        | Category  | Technology | Version | Notes                      |
        | --------- | ---------- | ------- | -------------------------- |
        | Runtime   | Node.js    | 16.x    | [Any constraints]          |
        | Framework | Express    | 4.18.2  | [Custom middleware?]       |
        | Database  | PostgreSQL | 13      | [Connection pooling setup] |

        etc...
