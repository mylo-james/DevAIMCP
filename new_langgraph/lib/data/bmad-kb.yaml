  - id: core-architecture
    title: Core Architecture
    level: 2
    sections:
    - id: system-overview
      title: System Overview
      level: 3
      content: The BMAD-METHOD™ is built around a modular architecture centered on
        the `bmad-core` directory, which serves as the brain of the entire system.
        This design enables the framework to operate effectively in both IDE environments
        (like Cursor, VS Code) and web-based AI interfaces (like ChatGPT, Gemini).
    - id: key-architectural-components
      title: Key Architectural Components
      level: 3
      sections:
      - id: 1-agents-bmad-core-agents
        title: 1. Agents (`bmad-core/agents/`)
        level: 4
        content: |-
          - **Purpose**: Each markdown file defines a specialized AI agent for a specific Agile role (PM, Dev, Architect, etc.)
          - **Structure**: Contains YAML headers specifying the agent's persona, capabilities, and dependencies
          - **Dependencies**: Lists of tasks, templates, checklists, and data files the agent can use
          - **Startup Instructions**: Can load project-specific documentation for immediate context
      - id: 2-agent-teams-bmad-core-agent-teams
        title: 2. Agent Teams (`bmad-core/agent-teams/`)
        level: 4
        content: |-
          - **Purpose**: Define collections of agents bundled together for specific purposes
          - **Examples**: `team-all.yaml` (comprehensive bundle), `team-fullstack.yaml` (full-stack development)
          - **Usage**: Creates pre-packaged contexts for web UI environments
      - id: 3-workflows-bmad-core-workflows
        title: 3. Workflows (`bmad-core/workflows/`)
        level: 4
        content: |-
          - **Purpose**: YAML files defining prescribed sequences of steps for specific project types
          - **Types**: Greenfield (new projects) and Brownfield (existing projects) for UI, service, and fullstack development
          - **Structure**: Defines agent interactions, artifacts created, and transition conditions
      - id: 4-reusable-resources
        title: 4. Reusable Resources
        level: 4
        content: |-
          - **Templates** (`bmad-core/templates/`): Markdown templates for PRDs, architecture specs, user stories
          - **Tasks** (`bmad-core/tasks/`): Instructions for specific repeatable actions like "shard-doc" or "create-next-story"
          - **Checklists** (`bmad-core/checklists/`): Quality assurance checklists for validation and review
          - **Data** (`bmad-core/data/`): Core knowledge base and technical preferences
    - id: dual-environment-architecture
      title: Dual Environment Architecture
      level: 3
      sections:
      - id: ide-environment
        title: IDE Environment
        level: 4
        content: |-
          - Users interact directly with agent markdown files
          - Agents can access all dependencies dynamically
          - Supports real-time file operations and project integration
          - Optimized for development workflow execution
      - id: web-ui-environment
        title: Web UI Environment
        level: 4
        content: |-
          - Uses pre-built bundles from `dist/teams` for stand alone 1 upload files for all agents and their assets with an orchestrating agent
          - Single text files containing all agent dependencies are in `dist/agents/` - these are unnecessary unless you want to create a web agent that is only a single agent and not a team
          - Created by the web-builder tool for upload to web interfaces
          - Provides complete context in one package
    - id: template-processing-system
      title: Template Processing System
      level: 3
      content: |-
        BMad employs a sophisticated template system with three key components:

        1. **Template Format** (`utils/bmad-doc-template.yaml`): Defines markup language for variable substitution and AI processing directives from yaml templates
        2. **Document Creation** (`tasks/create-doc.yaml`): Orchestrates template selection and user interaction to transform yaml spec to final markdown output
        3. **Advanced Elicitation** (`tasks/advanced-elicitation.yaml`): Provides interactive refinement through structured brainstorming
    - id: technical-preferences-integration
      title: Technical Preferences Integration
      level: 3
      content: |-
        The `technical-preferences.yaml` file serves as a persistent technical profile that:

        - Ensures consistency across all agents and projects
        - Eliminates repetitive technology specification
        - Provides personalized recommendations aligned with user preferences
        - Evolves over time with lessons learned
    - id: build-and-delivery-process
      title: Build and Delivery Process
      level: 3
      content: |-
        The `web-builder.js` tool creates web-ready bundles by:

        1. Reading agent or team definition files
        2. Recursively resolving all dependencies
        3. Concatenating content into single text files with clear separators
        4. Outputting ready-to-upload bundles for web AI interfaces

        This architecture enables seamless operation across environments while maintaining the rich, interconnected agent ecosystem that makes BMad powerful.
  - id: complete-development-workflow
    title: Complete Development Workflow
    level: 2
    sections:
    - id: planning-phase-web-ui-recommended-especially-gemini
      title: Planning Phase (Web UI Recommended - Especially Gemini!)
      level: 3
      content: |-
        **Ideal for cost efficiency with Gemini's massive context:**

        **For Brownfield Projects - Start Here!**:

        1. **Upload entire project to Gemini Web** (GitHub URL, files, or zip)
        2. **Document existing system**: `/analyst` → `*document-project`
        3. **Creates comprehensive docs** from entire codebase analysis

        **For All Projects**:

        1. **Optional Analysis**: `/analyst` - Market research, competitive analysis
        2. **Project Brief**: Create foundation document (Analyst or user)
        3. **PRD Creation**: `/pm create-doc prd` - Comprehensive product requirements
        4. **Architecture Design**: `/architect create-doc architecture` - Technical foundation
        5. **Validation & Alignment**: `/po` run master checklist to ensure document consistency
        6. **Document Preparation**: Copy final documents to project as `docs/prd.yaml` and `docs/architecture.yaml`
      sections:
      - id: example-planning-prompts
        title: Example Planning Prompts
        level: 4
        content: |-
          **For PRD Creation**:

          ```text
          "I want to build a [type] application that [core purpose].
          Help me brainstorm features and create a comprehensive PRD."
          ```

          **For Architecture Design**:

          ```text
          "Based on this PRD, design a scalable technical architecture
          that can handle [specific requirements]."
          ```
    - id: critical-transition-web-ui-to-ide
      title: 'Critical Transition: Web UI to IDE'
      level: 3
      content: |-
        **Once planning is complete, you MUST switch to IDE for development:**

        - **Why**: Development workflow requires file operations, real-time project integration, and document sharding
        - **Cost Benefit**: Web UI is more cost-effective for large document creation; IDE is optimized for development tasks
        - **Required Files**: Ensure `docs/prd.yaml` and `docs/architecture.yaml` exist in your project
    - id: ide-development-workflow
      title: IDE Development Workflow
      level: 3
      content: |-
        **Prerequisites**: Planning documents must exist in `docs/` folder

        1. **Document Sharding** (CRITICAL STEP):
           - Documents created by PM/Architect (in Web or IDE) MUST be sharded for development
           - Two methods to shard:
             a) **Manual**: Drag `shard-doc` task + document file into chat
             b) **Agent**: Ask `@bmad-master` or `@po` to shard documents
           - Shards `docs/prd.yaml` → `docs/prd/` folder
           - Shards `docs/architecture.yaml` → `docs/architecture/` folder
           - **WARNING**: Do NOT shard in Web UI - copying many small files is painful!

        2. **Verify Sharded Content**:
           - At least one `epic-n.yaml` file in `docs/prd/` with stories in development order
           - Source tree document and coding standards for dev agent reference
           - Sharded docs for SM agent story creation

        Resulting Folder Structure:

        - `docs/prd/` - Broken down PRD sections
        - `docs/architecture/` - Broken down architecture sections
        - `docs/stories/` - Generated user stories

        1. **Development Cycle** (Sequential, one story at a time):

           **CRITICAL CONTEXT MANAGEMENT**:
           - **Context windows matter!** Always use fresh, clean context windows
           - **Model selection matters!** Use most powerful thinking model for SM story creation
           - **ALWAYS start new chat between SM, Dev, and QA work**

           **Step 1 - Story Creation**:
           - **NEW CLEAN CHAT** → Select powerful model → `@sm` → `*create`
           - SM executes create-next-story task
           - Review generated story in `docs/stories/`
           - Update status from "Draft" to "Approved"

           **Step 2 - Story Implementation**:
           - **NEW CLEAN CHAT** → `@dev`
           - Agent asks which story to implement
           - Include story file content to save dev agent lookup time
           - Dev follows tasks/subtasks, marking completion
           - Dev maintains File List of all changes
           - Dev marks story as "Review" when complete with all tests passing

           **Step 3 - Senior QA Review**:
           - **NEW CLEAN CHAT** → `@qa` → execute review-story task
           - QA performs senior developer code review
           - QA can refactor and improve code directly
           - QA appends results to story's QA Results section
           - If approved: Status → "Done"
           - If changes needed: Status stays "Review" with unchecked items for dev

           **Step 4 - Repeat**: Continue SM → Dev → QA cycle until all epic stories complete

        **Important**: Only 1 story in progress at a time, worked sequentially until all epic stories complete.
    - id: status-tracking-workflow
      title: Status Tracking Workflow
      level: 3
      content: |-
        Stories progress through defined statuses:

        - **Draft** → **Approved** → **InProgress** → **Done**

        Each status change requires user verification and approval before proceeding.
    - id: workflow-types
      title: Workflow Types
      level: 3
      sections:
      - id: greenfield-development
        title: Greenfield Development
        level: 4
        content: |-
          - Business analysis and market research
          - Product requirements and feature definition
          - System architecture and design
          - Development execution
          - Testing and deployment
      - id: brownfield-enhancement-existing-projects
        title: Brownfield Enhancement (Existing Projects)
        level: 4
        content: |-
          **Key Concept**: Brownfield development requires comprehensive documentation of your existing project for AI agents to understand context, patterns, and constraints.

          **Complete Brownfield Workflow Options**:

          **Option 1: PRD-First (Recommended for Large Codebases/Monorepos)**:

          1. **Upload project to Gemini Web** (GitHub URL, files, or zip)
          2. **Create PRD first**: `@pm` → `*create-doc brownfield-prd`
          3. **Focused documentation**: `@analyst` → `*document-project`
             - Analyst asks for focus if no PRD provided
             - Choose "single document" format for Web UI
             - Uses PRD to document ONLY relevant areas
             - Creates one comprehensive markdown file
             - Avoids bloating docs with unused code

          **Option 2: Document-First (Good for Smaller Projects)**:

          1. **Upload project to Gemini Web**
          2. **Document everything**: `@analyst` → `*document-project`
          3. **Then create PRD**: `@pm` → `*create-doc brownfield-prd`
             - More thorough but can create excessive documentation

          4. **Requirements Gathering**:
             - **Brownfield PRD**: Use PM agent with `brownfield-prd-tmpl`
             - **Analyzes**: Existing system, constraints, integration points
             - **Defines**: Enhancement scope, compatibility requirements, risk assessment
             - **Creates**: Epic and story structure for changes

          5. **Architecture Planning**:
             - **Brownfield Architecture**: Use Architect agent with `brownfield-architecture-tmpl`
             - **Integration Strategy**: How new features integrate with existing system
             - **Migration Planning**: Gradual rollout and backwards compatibility
             - **Risk Mitigation**: Addressing potential breaking changes

          **Brownfield-Specific Resources**:

          **Templates**:

          - `brownfield-prd-tmpl.yaml`: Comprehensive enhancement planning with existing system analysis
          - `brownfield-architecture-tmpl.yaml`: Integration-focused architecture for existing systems

          **Tasks**:

          - `document-project`: Generates comprehensive documentation from existing codebase
          - `brownfield-create-epic`: Creates single epic for focused enhancements (when full PRD is overkill)
          - `brownfield-create-story`: Creates individual story for small, isolated changes

          **When to Use Each Approach**:

          **Full Brownfield Workflow** (Recommended for):

          - Major feature additions
          - System modernization
          - Complex integrations
          - Multiple related changes

          **Quick Epic/Story Creation** (Use when):

          - Single, focused enhancement
          - Isolated bug fixes
          - Small feature additions
          - Well-documented existing system

          **Critical Success Factors**:

          1. **Documentation First**: Always run `document-project` if docs are outdated/missing
          2. **Context Matters**: Provide agents access to relevant code sections
          3. **Integration Focus**: Emphasize compatibility and non-breaking changes
          4. **Incremental Approach**: Plan for gradual rollout and testing

          **For detailed guide**: See `docs/working-in-the-brownfield.yaml`
  - id: document-creation-best-practices
    title: Document Creation Best Practices
    level: 2
    sections:
    - id: required-file-naming-for-framework-integration
      title: Required File Naming for Framework Integration
      level: 3
      content: |-
        - `docs/prd.yaml` - Product Requirements Document
        - `docs/architecture.yaml` - System Architecture Document

        **Why These Names Matter**:

        - Agents automatically reference these files during development
        - Sharding tasks expect these specific filenames
        - Workflow automation depends on standard naming
    - id: cost-effective-document-creation-workflow
      title: Cost-Effective Document Creation Workflow
      level: 3
      content: |-
        **Recommended for Large Documents (PRD, Architecture):**

        1. **Use Web UI**: Create documents in web interface for cost efficiency
        2. **Copy Final Output**: Save complete markdown to your project
        3. **Standard Names**: Save as `docs/prd.yaml` and `docs/architecture.yaml`
        4. **Switch to IDE**: Use IDE agents for development and smaller documents
    - id: document-sharding
      title: Document Sharding
      level: 3
      content: |-
        Templates with Level 2 headings (`##`) can be automatically sharded:

        **Original PRD**:

        ```markdown
  - id: goals-and-background-context
    title: Goals and Background Context
    level: 2
  - id: requirements
    title: Requirements
    level: 2
  - id: user-interface-design-goals
    title: User Interface Design Goals
    level: 2
  - id: success-metrics
    title: Success Metrics
    level: 2
    content: |-
      ```

      **After Sharding**:

      - `docs/prd/goals-and-background-context.yaml`
      - `docs/prd/requirements.yaml`
      - `docs/prd/user-interface-design-goals.yaml`
      - `docs/prd/success-metrics.yaml`

      Use the `shard-doc` task or `@kayvan/markdown-tree-parser` tool for automatic sharding.
  - id: usage-patterns-and-best-practices
    title: Usage Patterns and Best Practices
    level: 2
    sections:
    - id: environment-specific-usage
      title: Environment-Specific Usage
      level: 3
      content: |-
        **Web UI Best For**:

        - Initial planning and documentation phases
        - Cost-effective large document creation
        - Agent consultation and brainstorming
        - Multi-agent workflows with orchestrator

        **IDE Best For**:

        - Active development and implementation
        - File operations and project integration
        - Story management and development cycles
        - Code review and debugging
    - id: quality-assurance
      title: Quality Assurance
      level: 3
      content: |-
        - Use appropriate agents for specialized tasks
        - Follow Agile ceremonies and review processes
        - Maintain document consistency with PO agent
        - Regular validation with checklists and templates
    - id: performance-optimization
      title: Performance Optimization
      level: 3
      content: |-
        - Use specific agents vs. `bmad-master` for focused tasks
        - Choose appropriate team size for project needs
        - Leverage technical preferences for consistency
        - Regular context management and cache clearing
  - id: success-tips
    title: Success Tips
    level: 2
    content: |-
      - **Use Gemini for big picture planning** - The team-fullstack bundle provides collaborative expertise
      - **Use bmad-master for document organization** - Sharding creates manageable chunks
      - **Follow the SM → Dev cycle religiously** - This ensures systematic progress
      - **Keep conversations focused** - One agent, one task per conversation
      - **Review everything** - Always review and approve before marking complete
  - id: contributing-to-bmad-method
    title: Contributing to BMAD-METHOD™
    level: 2
    sections:
    - id: quick-contribution-guidelines
      title: Quick Contribution Guidelines
      level: 3
      content: |-
        For full details, see `CONTRIBUTING.yaml`. Key points:

        **Fork Workflow**:

        1. Fork the repository
        2. Create feature branches
        3. Submit PRs to `next` branch (default) or `main` for critical fixes only
        4. Keep PRs small: 200-400 lines ideal, 800 lines maximum
        5. One feature/fix per PR

        **PR Requirements**:

        - Clear descriptions (max 200 words) with What/Why/How/Testing
        - Use conventional commits (feat:, fix:, docs:)
        - Atomic commits - one logical change per commit
        - Must align with guiding principles

        **Core Principles** (from docs/GUIDING-PRINCIPLES.yaml):

        - **Dev Agents Must Be Lean**: Minimize dependencies, save context for code
        - **Natural Language First**: Everything in markdown, no code in core
        - **Core vs Expansion Packs**: Core for universal needs, packs for specialized domains
        - **Design Philosophy**: "Dev agents code, planning agents plan"
  - id: expansion-packs
    title: Expansion Packs
    level: 2
    sections:
    - id: what-are-expansion-packs
      title: What Are Expansion Packs?
      level: 3
      content: Expansion packs extend BMAD-METHOD™ beyond traditional software development
        into ANY domain. They provide specialized agent teams, templates, and workflows
        while keeping the core framework lean and focused on development.
    - id: why-use-expansion-packs
      title: Why Use Expansion Packs?
      level: 3
      content: |-
        1. **Keep Core Lean**: Dev agents maintain maximum context for coding
        2. **Domain Expertise**: Deep, specialized knowledge without bloating core
        3. **Community Innovation**: Anyone can create and share packs
        4. **Modular Design**: Install only what you need
    - id: available-expansion-packs
      title: Available Expansion Packs
      level: 3
      content: |-
        **Technical Packs**:

        - **Infrastructure/DevOps**: Cloud architects, SRE experts, security specialists
        - **Game Development**: Game designers, level designers, narrative writers
        - **Mobile Development**: iOS/Android specialists, mobile UX experts
        - **Data Science**: ML engineers, data scientists, visualization experts

        **Non-Technical Packs**:

        - **Business Strategy**: Consultants, financial analysts, marketing strategists
        - **Creative Writing**: Plot architects, character developers, world builders
        - **Health & Wellness**: Fitness trainers, nutritionists, habit engineers
        - **Education**: Curriculum designers, assessment specialists
        - **Legal Support**: Contract analysts, compliance checkers

        **Specialty Packs**:

        - **Expansion Creator**: Tools to build your own expansion packs
        - **RPG Game Master**: Tabletop gaming assistance
        - **Life Event Planning**: Wedding planners, event coordinators
        - **Scientific Research**: Literature reviewers, methodology designers
    - id: using-expansion-packs
      title: Using Expansion Packs
      level: 3
      content: |-
        1. **Browse Available Packs**: Check `expansion-packs/` directory
        2. **Get Inspiration**: See `docs/expansion-packs.yaml` for detailed examples and ideas
        3. **Install via CLI**:

           ```bash
           npx bmad-method install
           # Select "Install expansion pack" option
           ```

        4. **Use in Your Workflow**: Installed packs integrate seamlessly with existing agents
    - id: creating-custom-expansion-packs
      title: Creating Custom Expansion Packs
      level: 3
      content: |-
        Use the **expansion-creator** pack to build your own:

        1. **Define Domain**: What expertise are you capturing?
        2. **Design Agents**: Create specialized roles with clear boundaries
        3. **Build Resources**: Tasks, templates, checklists for your domain
        4. **Test & Share**: Validate with real use cases, share with community

        **Key Principle**: Expansion packs democratize expertise by making specialized knowledge accessible through AI agents.
  - id: getting-help
    title: Getting Help
    level: 2
    content: |-
      - **Commands**: Use `*/*help` in any environment to see available commands
      - **Agent Switching**: Use `*/*switch agent-name` with orchestrator for role changes
      - **Documentation**: Check `docs/` folder for project-specific context
      - **Community**: Discord and GitHub resources available for support
      - **Contributing**: See `CONTRIBUTING.yaml` for full guidelines
