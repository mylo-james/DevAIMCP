    title: Introduction
    level: 2
    content: This document captures the CURRENT STATE of the [Project Name] codebase,
      including technical debt, workarounds, and real-world patterns. It serves as
      a reference for AI agents working on enhancements.
    sections:
    - id: document-scope
      title: Document Scope
      level: 3
      content: |-
        [If PRD provided: "Focused on areas relevant to: {enhancement description}"]
        [If no PRD: "Comprehensive documentation of entire system"]
    - id: change-log
      title: Change Log
      level: 3
      content: |-
        | Date   | Version | Description                 | Author    |
        | ------ | ------- | --------------------------- | --------- |
        | [Date] | 1.0     | Initial brownfield analysis | [Analyst] |
