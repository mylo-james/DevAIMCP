sections:
- id: bmad-knowledge-base
  title: BMAD™ Knowledge Base
  level: 1
  sections:
  - id: overview
    title: Overview
    level: 2
    content: BMAD-METHOD™ (Breakthrough Method of Agile AI-driven Development) is
      a framework that combines AI agents with Agile development methodologies. The
      v4 system introduces a modular architecture with improved dependency management,
      bundle optimization, and support for both web and IDE environments.
    sections:
    - id: key-features
      title: Key Features
      level: 3
      content: |-
        - **Modular Agent System**: Specialized AI agents for each Agile role
        - **Build System**: Automated dependency resolution and optimization
        - **Dual Environment Support**: Optimized for both web UIs and IDEs
        - **Reusable Resources**: Portable templates, tasks, and checklists
        - **Slash Command Integration**: Quick agent switching and control
    - id: when-to-use-bmad
      title: When to Use BMad
      level: 3
      content: |-
        - **New Projects (Greenfield)**: Complete end-to-end development
        - **Existing Projects (Brownfield)**: Feature additions and enhancements
        - **Team Collaboration**: Multiple roles working together
        - **Quality Assurance**: Structured testing and validation
        - **Documentation**: Professional PRDs, architecture docs, user stories
  - id: how-bmad-works
    title: How BMad Works
    level: 2
    sections:
    - id: the-core-method
      title: The Core Method
      level: 3
      content: |-
        BMad transforms you into a "Vibe CEO" - directing a team of specialized AI agents through structured workflows. Here's how:

        1. **You Direct, AI Executes**: You provide vision and decisions; agents handle implementation details
        2. **Specialized Agents**: Each agent masters one role (PM, Developer, Architect, etc.)
        3. **Structured Workflows**: Proven patterns guide you from idea to deployed code
        4. **Clean Handoffs**: Fresh context windows ensure agents stay focused and effective
    - id: the-two-phase-approach
      title: The Two-Phase Approach
      level: 3
      sections:
      - id: phase-1-planning-web-ui-cost-effective
        title: 'Phase 1: Planning (Web UI - Cost Effective)'
        level: 4
        content: |-
          - Use large context windows (Gemini's 1M tokens)
          - Generate comprehensive documents (PRD, Architecture)
          - Leverage multiple agents for brainstorming
          - Create once, use throughout development
      - id: phase-2-development-ide-implementation
        title: 'Phase 2: Development (IDE - Implementation)'
        level: 4
        content: |-
          - Shard documents into manageable pieces
          - Execute focused SM → Dev cycles
          - One story at a time, sequential progress
          - Real-time file operations and testing
    - id: the-development-loop
      title: The Development Loop
      level: 3
      content: |-
        ```text
        1. SM Agent (New Chat) → Creates next story from sharded docs
        2. You → Review and approve story
        3. Dev Agent (New Chat) → Implements approved story
        4. QA Agent (New Chat) → Reviews and refactors code
        5. You → Verify completion
        6. Repeat until epic complete
        ```
    - id: why-this-works
      title: Why This Works
      level: 3
      content: |-
        - **Context Optimization**: Clean chats = better AI performance
        - **Role Clarity**: Agents don't context-switch = higher quality
        - **Incremental Progress**: Small stories = manageable complexity
        - **Human Oversight**: You validate each step = quality control
        - **Document-Driven**: Specs guide everything = consistency
  - id: getting-started
    title: Getting Started
    level: 2
    sections:
    - id: quick-start-options
      title: Quick Start Options
      level: 3
      sections:
      - id: option-1-web-ui
        title: 'Option 1: Web UI'
        level: 4
        content: |-
          **Best for**: ChatGPT, Claude, Gemini users who want to start immediately

          1. Navigate to `dist/teams/`
          2. Copy `team-fullstack.txt` content
          3. Create new Gemini Gem or CustomGPT
          4. Upload file with instructions: "Your critical operating instructions are attached, do not break character as directed"
          5. Type `/help` to see available commands
      - id: option-2-ide-integration
        title: 'Option 2: IDE Integration'
        level: 4
        content: |-
          **Best for**: Cursor, Claude Code, Windsurf, Trae, Cline, Roo Code, Github Copilot users

          ```bash
- id: interactive-installation-recommended
  title: Interactive installation (recommended)
  level: 1
  content: |-
    npx bmad-method install
    ```

    **Installation Steps**:

    - Choose "Complete installation"
    - Select your IDE from supported options:
      - **Cursor**: Native AI integration
      - **Claude Code**: Anthropic's official IDE
      - **Windsurf**: Built-in AI capabilities
      - **Trae**: Built-in AI capabilities
      - **Cline**: VS Code extension with AI features
      - **Roo Code**: Web-based IDE with agent support
      - **GitHub Copilot**: VS Code extension with AI peer programming assistant
      - **Auggie CLI (Augment Code)**: AI-powered development environment

    **Note for VS Code Users**: BMAD-METHOD™ assumes when you mention "VS Code" that you're using it with an AI-powered extension like GitHub Copilot, Cline, or Roo. Standard VS Code without AI capabilities cannot run BMad agents. The installer includes built-in support for Cline and Roo.

    **Verify Installation**:

    - `.bmad-core/` folder created with all agents
    - IDE-specific integration files created
    - All agent commands/rules/modes available

    **Remember**: At its core, BMAD-METHOD™ is about mastering and harnessing prompt engineering. Any IDE with AI agent support can use BMad - the framework provides the structured prompts and workflows that make AI development effective
  sections:
  - id: environment-selection-guide
    title: Environment Selection Guide
    level: 3
    content: |-
      **Use Web UI for**:

      - Initial planning and documentation (PRD, architecture)
      - Cost-effective document creation (especially with Gemini)
      - Brainstorming and analysis phases
      - Multi-agent consultation and planning

      **Use IDE for**:

      - Active development and coding
      - File operations and project integration
      - Document sharding and story management
      - Implementation workflow (SM/Dev cycles)

      **Cost-Saving Tip**: Create large documents (PRDs, architecture) in web UI, then copy to `docs/prd.yaml` and `docs/architecture.yaml` in your project before switching to IDE for development.
  - id: ide-only-workflow-considerations
    title: IDE-Only Workflow Considerations
    level: 3
    content: |-
      **Can you do everything in IDE?** Yes, but understand the tradeoffs:

      **Pros of IDE-Only**:

      - Single environment workflow
      - Direct file operations from start
      - No copy/paste between environments
      - Immediate project integration

      **Cons of IDE-Only**:

      - Higher token costs for large document creation
      - Smaller context windows (varies by IDE/model)
      - May hit limits during planning phases
      - Less cost-effective for brainstorming

      **Using Web Agents in IDE**:

      - **NOT RECOMMENDED**: Web agents (PM, Architect) have rich dependencies designed for large contexts
      - **Why it matters**: Dev agents are kept lean to maximize coding context
      - **The principle**: "Dev agents code, planning agents plan" - mixing breaks this optimization

      **About bmad-master and bmad-orchestrator**:

      - **bmad-master**: CAN do any task without switching agents, BUT...
      - **Still use specialized agents for planning**: PM, Architect, and UX Expert have tuned personas that produce better results
      - **Why specialization matters**: Each agent's personality and focus creates higher quality outputs
      - **If using bmad-master/orchestrator**: Fine for planning phases, but...

      **CRITICAL RULE for Development**:

      - **ALWAYS use SM agent for story creation** - Never use bmad-master or bmad-orchestrator
      - **ALWAYS use Dev agent for implementation** - Never use bmad-master or bmad-orchestrator
      - **Why this matters**: SM and Dev agents are specifically optimized for the development workflow
      - **No exceptions**: Even if using bmad-master for everything else, switch to SM → Dev for implementation

      **Best Practice for IDE-Only**:

      1. Use PM/Architect/UX agents for planning (better than bmad-master)
      2. Create documents directly in project
      3. Shard immediately after creation
      4. **MUST switch to SM agent** for story creation
      5. **MUST switch to Dev agent** for implementation
      6. Keep planning and coding in separate chat sessions
  - id: core-configuration-core-config-yaml
    title: Core Configuration (core-config.yaml)
    level: 2
    content: '**New in V4**: The `bmad-core/core-config.yaml` file is a critical innovation
      that enables BMad to work seamlessly with any project structure, providing maximum
      flexibility and backwards compatibility.'
    sections:
    - id: what-is-core-config-yaml
      title: What is core-config.yaml?
      level: 3
      content: |-
        This configuration file acts as a map for BMad agents, telling them exactly where to find your project documents and how they're structured. It enables:

        - **Version Flexibility**: Work with V3, V4, or custom document structures
        - **Custom Locations**: Define where your documents and shards live
        - **Developer Context**: Specify which files the dev agent should always load
        - **Debug Support**: Built-in logging for troubleshooting
    - id: key-configuration-areas
      title: Key Configuration Areas
      level: 3
      sections:
      - id: prd-configuration
        title: PRD Configuration
        level: 4
        content: |-
          - **prdVersion**: Tells agents if PRD follows v3 or v4 conventions
          - **prdSharded**: Whether epics are embedded (false) or in separate files (true)
          - **prdShardedLocation**: Where to find sharded epic files
          - **epicFilePattern**: Pattern for epic filenames (e.g., `epic-{n}*.yaml`)
      - id: architecture-configuration
        title: Architecture Configuration
        level: 4
        content: |-
          - **architectureVersion**: v3 (monolithic) or v4 (sharded)
          - **architectureSharded**: Whether architecture is split into components
          - **architectureShardedLocation**: Where sharded architecture files live
      - id: developer-files
        title: Developer Files
        level: 4
        content: |-
          - **devLoadAlwaysFiles**: List of files the dev agent loads for every task
          - **devDebugLog**: Where dev agent logs repeated failures
          - **agentCoreDump**: Export location for chat conversations
    - id: why-it-matters
      title: Why It Matters
      level: 3
      content: |-
        1. **No Forced Migrations**: Keep your existing document structure
        2. **Gradual Adoption**: Start with V3 and migrate to V4 at your pace
        3. **Custom Workflows**: Configure BMad to match your team's process
        4. **Intelligent Agents**: Agents automatically adapt to your configuration
    - id: common-configurations
      title: Common Configurations
      level: 3
      content: |-
        **Legacy V3 Project**:

        ```yaml
        prdVersion: v3
        prdSharded: false
        architectureVersion: v3
        architectureSharded: false
        ```

        **V4 Optimized Project**:

        ```yaml
        prdVersion: v4
        prdSharded: true
        prdShardedLocation: docs/prd
        architectureVersion: v4
        architectureSharded: true
        architectureShardedLocation: docs/architecture
        ```
  - id: core-philosophy
    title: Core Philosophy
    level: 2
    sections:
    - id: vibe-ceo-ing
      title: Vibe CEO'ing
      level: 3
      content: |-
        You are the "Vibe CEO" - thinking like a CEO with unlimited resources and a singular vision. Your AI agents are your high-powered team, and your role is to:

        - **Direct**: Provide clear instructions and objectives
        - **Refine**: Iterate on outputs to achieve quality
        - **Oversee**: Maintain strategic alignment across all agents
    - id: core-principles
      title: Core Principles
      level: 3
      content: |-
        1. **MAXIMIZE_AI_LEVERAGE**: Push the AI to deliver more. Challenge outputs and iterate.
        2. **QUALITY_CONTROL**: You are the ultimate arbiter of quality. Review all outputs.
        3. **STRATEGIC_OVERSIGHT**: Maintain the high-level vision and ensure alignment.
        4. **ITERATIVE_REFINEMENT**: Expect to revisit steps. This is not a linear process.
        5. **CLEAR_INSTRUCTIONS**: Precise requests lead to better outputs.
        6. **DOCUMENTATION_IS_KEY**: Good inputs (briefs, PRDs) lead to good outputs.
        7. **START_SMALL_SCALE_FAST**: Test concepts, then expand.
        8. **EMBRACE_THE_CHAOS**: Adapt and overcome challenges.
    - id: key-workflow-principles
      title: Key Workflow Principles
      level: 3
      content: |-
        1. **Agent Specialization**: Each agent has specific expertise and responsibilities
        2. **Clean Handoffs**: Always start fresh when switching between agents
        3. **Status Tracking**: Maintain story statuses (Draft → Approved → InProgress → Done)
        4. **Iterative Development**: Complete one story before starting the next
        5. **Documentation First**: Always start with solid PRD and architecture
  - id: agent-system
    title: Agent System
    level: 2
    sections:
    - id: core-development-team
      title: Core Development Team
      level: 3
      content: |-
        | Agent       | Role               | Primary Functions                       | When to Use                            |
        | ----------- | ------------------ | --------------------------------------- | -------------------------------------- |
        | `analyst`   | Business Analyst   | Market research, requirements gathering | Project planning, competitive analysis |
        | `pm`        | Product Manager    | PRD creation, feature prioritization    | Strategic planning, roadmaps           |
        | `architect` | Solution Architect | System design, technical architecture   | Complex systems, scalability planning  |
        | `dev`       | Developer          | Code implementation, debugging          | All development tasks                  |
        | `qa`        | QA Specialist      | Test planning, quality assurance        | Testing strategies, bug validation     |
        | `ux-expert` | UX Designer        | UI/UX design, prototypes                | User experience, interface design      |
        | `po`        | Product Owner      | Backlog management, story validation    | Story refinement, acceptance criteria  |
        | `sm`        | Scrum Master       | Sprint planning, story creation         | Project management, workflow           |
    - id: meta-agents
      title: Meta Agents
      level: 3
      content: |-
        | Agent               | Role             | Primary Functions                     | When to Use                       |
        | ------------------- | ---------------- | ------------------------------------- | --------------------------------- |
        | `bmad-orchestrator` | Team Coordinator | Multi-agent workflows, role switching | Complex multi-role tasks          |
        | `bmad-master`       | Universal Expert | All capabilities without switching    | Single-session comprehensive work |
    - id: agent-interaction-commands
      title: Agent Interaction Commands
      level: 3
      sections:
      - id: ide-specific-syntax
        title: IDE-Specific Syntax
        level: 4
        content: |-
          **Agent Loading by IDE**:

          - **Claude Code**: `/agent-name` (e.g., `/bmad-master`)
          - **Cursor**: `@agent-name` (e.g., `@bmad-master`)
          - **Windsurf**: `/agent-name` (e.g., `/bmad-master`)
          - **Trae**: `@agent-name` (e.g., `@bmad-master`)
          - **Roo Code**: Select mode from mode selector (e.g., `bmad-master`)
          - **GitHub Copilot**: Open the Chat view (`⌃⌘I` on Mac, `Ctrl+Alt+I` on Windows/Linux) and select **Agent** from the chat mode selector.

          **Chat Management Guidelines**:

          - **Claude Code, Cursor, Windsurf, Trae**: Start new chats when switching agents
          - **Roo Code**: Switch modes within the same conversation

          **Common Task Commands**:

          - `*help` - Show available commands
          - `*status` - Show current context/progress
          - `*exit` - Exit the agent mode
          - `*shard-doc docs/prd.yaml prd` - Shard PRD into manageable pieces
          - `*shard-doc docs/architecture.yaml architecture` - Shard architecture document
          - `*create` - Run create-next-story task (SM agent)

          **In Web UI**:

          ```text
          /pm create-doc prd
          /architect review system design
          /dev implement story 1.2
          /help - Show available commands
          /switch agent-name - Change active agent (if orchestrator available)
          ```
  - id: team-configurations
    title: Team Configurations
    level: 2
    sections:
    - id: pre-built-teams
