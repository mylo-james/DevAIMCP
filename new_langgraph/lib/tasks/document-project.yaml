        - Type: [Monorepo/Polyrepo/Hybrid]
        - Package Manager: [npm/yarn/pnpm]
        - Notable: [Any unusual structure decisions]
  - id: source-tree-and-module-organization
    title: Source Tree and Module Organization
    level: 2
    sections:
    - id: project-structure-actual
      title: Project Structure (Actual)
      level: 3
      content: |-
        ```text
        project-root/
        ├── src/
        │   ├── controllers/     # HTTP request handlers
        │   ├── services/        # Business logic (NOTE: inconsistent patterns between user and payment services)
        │   ├── models/          # Database models (Sequelize)
        │   ├── utils/           # Mixed bag - needs refactoring
        │   └── legacy/          # DO NOT MODIFY - old payment system still in use
        ├── tests/               # Jest tests (60% coverage)
        ├── scripts/             # Build and deployment scripts
        └── config/              # Environment configs
        ```
    - id: key-modules-and-their-purpose
      title: Key Modules and Their Purpose
      level: 3
      content: |-
        - **User Management**: `src/services/userService.js` - Handles all user operations
        - **Authentication**: `src/middleware/auth.js` - JWT-based, custom implementation
        - **Payment Processing**: `src/legacy/payment.js` - CRITICAL: Do not refactor, tightly coupled
        - **[List other key modules with their actual files]**
  - id: data-models-and-apis
    title: Data Models and APIs
    level: 2
    sections:
    - id: data-models
      title: Data Models
      level: 3
      content: |-
        Instead of duplicating, reference actual model files:

        - **User Model**: See `src/models/User.js`
        - **Order Model**: See `src/models/Order.js`
        - **Related Types**: TypeScript definitions in `src/types/`
    - id: api-specifications
      title: API Specifications
      level: 3
      content: |-
        - **OpenAPI Spec**: `docs/api/openapi.yaml` (if exists)
        - **Postman Collection**: `docs/api/postman-collection.json`
        - **Manual Endpoints**: [List any undocumented endpoints discovered]
  - id: technical-debt-and-known-issues
    title: Technical Debt and Known Issues
    level: 2
    sections:
    - id: critical-technical-debt
      title: Critical Technical Debt
      level: 3
      content: |-
        1. **Payment Service**: Legacy code in `src/legacy/payment.js` - tightly coupled, no tests
        2. **User Service**: Different pattern than other services, uses callbacks instead of promises
        3. **Database Migrations**: Manually tracked, no proper migration tool
        4. **[Other significant debt]**
    - id: workarounds-and-gotchas
      title: Workarounds and Gotchas
      level: 3
      content: |-
        - **Environment Variables**: Must set `NODE_ENV=production` even for staging (historical reason)
        - **Database Connections**: Connection pool hardcoded to 10, changing breaks payment service
        - **[Other workarounds developers need to know]**
  - id: integration-points-and-external-dependencies
    title: Integration Points and External Dependencies
    level: 2
    sections:
    - id: external-services
      title: External Services
      level: 3
      content: |-
        | Service  | Purpose  | Integration Type | Key Files                      |
        | -------- | -------- | ---------------- | ------------------------------ |
        | Stripe   | Payments | REST API         | `src/integrations/stripe/`     |
        | SendGrid | Emails   | SDK              | `src/services/emailService.js` |

        etc...
    - id: internal-integration-points
      title: Internal Integration Points
      level: 3
      content: |-
        - **Frontend Communication**: REST API on port 3000, expects specific headers
        - **Background Jobs**: Redis queue, see `src/workers/`
        - **[Other integrations]**
  - id: development-and-deployment
    title: Development and Deployment
    level: 2
    sections:
    - id: local-development-setup
      title: Local Development Setup
      level: 3
      content: |-
        1. Actual steps that work (not ideal steps)
        2. Known issues with setup
        3. Required environment variables (see `.env.example`)
    - id: build-and-deployment-process
      title: Build and Deployment Process
      level: 3
      content: |-
        - **Build Command**: `npm run build` (webpack config in `webpack.config.js`)
        - **Deployment**: Manual deployment via `scripts/deploy.sh`
        - **Environments**: Dev, Staging, Prod (see `config/environments/`)
  - id: testing-reality
    title: Testing Reality
    level: 2
    sections:
    - id: current-test-coverage
      title: Current Test Coverage
      level: 3
      content: |-
        - Unit Tests: 60% coverage (Jest)
        - Integration Tests: Minimal, in `tests/integration/`
        - E2E Tests: None
        - Manual Testing: Primary QA method
    - id: running-tests
      title: Running Tests
      level: 3
      content: |-
        ```bash
        npm test           # Runs unit tests
        npm run test:integration  # Runs integration tests (requires local DB)
        ```
  - id: if-enhancement-prd-provided-impact-analysis
    title: If Enhancement PRD Provided - Impact Analysis
    level: 2
    sections:
    - id: files-that-will-need-modification
      title: Files That Will Need Modification
      level: 3
      content: |-
        Based on the enhancement requirements, these files will be affected:

        - `src/services/userService.js` - Add new user fields
        - `src/models/User.js` - Update schema
        - `src/routes/userRoutes.js` - New endpoints
        - [etc...]
    - id: new-files-modules-needed
      title: New Files/Modules Needed
      level: 3
      content: |-
        - `src/services/newFeatureService.js` - New business logic
        - `src/models/NewFeature.js` - New data model
        - [etc...]
    - id: integration-considerations
      title: Integration Considerations
      level: 3
      content: |-
        - Will need to integrate with existing auth middleware
        - Must follow existing response format in `src/utils/responseFormatter.js`
        - [Other integration points]
  - id: appendix-useful-commands-and-scripts
    title: Appendix - Useful Commands and Scripts
    level: 2
    sections:
    - id: frequently-used-commands
      title: Frequently Used Commands
      level: 3
      content: |-
        ```bash
        npm run dev         # Start development server
        npm run build       # Production build
        npm run migrate     # Run database migrations
        npm run seed        # Seed test data
        ```
    - id: debugging-and-troubleshooting
      title: Debugging and Troubleshooting
      level: 3
      content: |-
        - **Logs**: Check `logs/app.log` for application logs
        - **Debug Mode**: Set `DEBUG=app:*` for verbose logging
        - **Common Issues**: See `docs/troubleshooting.yaml`]]
    - id: 4-document-delivery
      title: 4. Document Delivery
      level: 3
      content: |-
        1. **In Web UI (Gemini, ChatGPT, Claude)**:
           - Present the entire document in one response (or multiple if too long)
           - Tell user to copy and save as `docs/brownfield-architecture.yaml` or `docs/project-architecture.yaml`
           - Mention it can be sharded later in IDE if needed

        2. **In IDE Environment**:
           - Create the document as `docs/brownfield-architecture.yaml`
           - Inform user this single document contains all architectural information
           - Can be sharded later using PO agent if desired

        The document should be comprehensive enough that future agents can understand:

        - The actual state of the system (not idealized)
        - Where to find key files and logic
        - What technical debt exists
        - What constraints must be respected
        - If PRD provided: What needs to change for the enhancement]]
    - id: 5-quality-assurance
      title: 5. Quality Assurance
      level: 3
      content: |-
        CRITICAL: Before finalizing the document:

        1. **Accuracy Check**: Verify all technical details match the actual codebase
        2. **Completeness Review**: Ensure all major system components are documented
        3. **Focus Validation**: If user provided scope, verify relevant areas are emphasized
        4. **Clarity Assessment**: Check that explanations are clear for AI agents
        5. **Navigation**: Ensure document has clear section structure for easy reference

        Apply the advanced elicitation task after major sections to refine based on user feedback.
  - id: success-criteria
    title: Success Criteria
    level: 2
    content: |-
      - Single comprehensive brownfield architecture document created
      - Document reflects REALITY including technical debt and workarounds
      - Key files and modules are referenced with actual paths
      - Models/APIs reference source files rather than duplicating content
      - If PRD provided: Clear impact analysis showing what needs to change
      - Document enables AI agents to navigate and understand the actual codebase
      - Technical constraints and "gotchas" are clearly documented
  - id: notes
    title: Notes
    level: 2
    content: |-
      - This task creates ONE document that captures the TRUE state of the system
      - References actual files rather than duplicating content when possible
      - Documents technical debt, workarounds, and constraints honestly
      - For brownfield projects with PRD: Provides clear enhancement impact analysis
      - The goal is PRACTICAL documentation for AI agents doing real work
