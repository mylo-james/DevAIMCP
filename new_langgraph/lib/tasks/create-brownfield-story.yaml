type: task
id: new_langgraph/lib/tasks/create-brownfield-story
title: Create Brownfield Story Task
version: 1
source_path: new_langgraph/lib/tasks/create-brownfield-story.yaml
summary: Create detailed, implementation-ready stories for brownfield projects where
  traditional sharded PRD/architecture documents may not exist. This task bridges
  the gap between various documentation formats (document-project output, brownfield
  PRDs, epics, or user documentation) and executable stories for the Dev agent.
metadata:
  powered_by: BMAD Core
  content_format: markdown
  original_extension: md
  converted_at: '2025-09-22'
  legacy_path: new_langgraph/lib/tasks/create-brownfield-story.md
sections:
- id: create-brownfield-story-task
  title: Create Brownfield Story Task
  level: 1
  sections:
  - id: purpose
    title: Purpose
    level: 2
    content: Create detailed, implementation-ready stories for brownfield projects
      where traditional sharded PRD/architecture documents may not exist. This task
      bridges the gap between various documentation formats (document-project output,
      brownfield PRDs, epics, or user documentation) and executable stories for the
      Dev agent.
  - id: when-to-use-this-task
    title: When to Use This Task
    level: 2
    content: |-
      **Use this task when:**

      - Working on brownfield projects with non-standard documentation
      - Stories need to be created from document-project output
      - Working from brownfield epics without full PRD/architecture
      - Existing project documentation doesn't follow BMad v4+ structure
      - Need to gather additional context from user during story creation

      **Use create-next-story when:**

      - Working with properly sharded PRD and v4 architecture documents
      - Following standard greenfield or well-documented brownfield workflow
      - All technical context is available in structured format
  - id: task-execution-instructions
    title: Task Execution Instructions
    level: 2
    sections:
    - id: 0-documentation-context
      title: 0. Documentation Context
      level: 3
      content: |-
        Check for available documentation in this order:

        1. **Sharded PRD/Architecture** (docs/prd/, docs/architecture/)
           - If found, recommend using create-next-story task instead

        2. **Brownfield Architecture Document** (docs/brownfield-architecture.yaml or similar)
           - Created by document-project task
           - Contains actual system state, technical debt, workarounds

        3. **Brownfield PRD** (docs/prd.yaml)
           - May contain embedded technical details

        4. **Epic Files** (docs/epics/ or similar)
           - Created by brownfield-create-epic task

        5. **User-Provided Documentation**
           - Ask user to specify location and format
    - id: 1-story-identification-and-context-gathering
      title: 1. Story Identification and Context Gathering
      level: 3
      sections:
      - id: 1-1-identify-story-source
        title: 1.1 Identify Story Source
        level: 4
        content: |-
          Based on available documentation:

          - **From Brownfield PRD**: Extract stories from epic sections
          - **From Epic Files**: Read epic definition and story list
          - **From User Direction**: Ask user which specific enhancement to implement
          - **No Clear Source**: Work with user to define the story scope
      - id: 1-2-gather-essential-context
        title: 1.2 Gather Essential Context
        level: 4
        content: |-
          CRITICAL: For brownfield stories, you MUST gather enough context for safe implementation. Be prepared to ask the user for missing information.

          **Required Information Checklist:**

          - [ ] What existing functionality might be affected?
          - [ ] What are the integration points with current code?
          - [ ] What patterns should be followed (with examples)?
          - [ ] What technical constraints exist?
          - [ ] Are there any "gotchas" or workarounds to know about?

          If any required information is missing, list the missing information and ask the user to provide it.
    - id: 2-extract-technical-context-from-available-sources
      title: 2. Extract Technical Context from Available Sources
      level: 3
      sections:
      - id: 2-1-from-document-project-output
        title: 2.1 From Document-Project Output
        level: 4
        content: |-
          If using brownfield-architecture.yaml from document-project:

          - **Technical Debt Section**: Note any workarounds affecting this story
          - **Key Files Section**: Identify files that will need modification
          - **Integration Points**: Find existing integration patterns
          - **Known Issues**: Check if story touches problematic areas
          - **Actual Tech Stack**: Verify versions and constraints
      - id: 2-2-from-brownfield-prd
        title: 2.2 From Brownfield PRD
        level: 4
        content: |-
          If using brownfield PRD:

          - **Technical Constraints Section**: Extract all relevant constraints
          - **Integration Requirements**: Note compatibility requirements
          - **Code Organization**: Follow specified patterns
          - **Risk Assessment**: Understand potential impacts
      - id: 2-3-from-user-documentation
        title: 2.3 From User Documentation
        level: 4
        content: |-
          Ask the user to help identify:

          - Relevant technical specifications
          - Existing code examples to follow
          - Integration requirements
          - Testing approaches used in the project
    - id: 3-story-creation-with-progressive-detail-gathering
      title: 3. Story Creation with Progressive Detail Gathering
      level: 3
      sections:
      - id: 3-1-create-initial-story-structure
        title: 3.1 Create Initial Story Structure
        level: 4
        content: |-
          Start with the story template, filling in what's known:

          ```markdown
- id: story-enhancement-title
  title: Story {{Enhancement Title}}
  level: 1
  sections:
  - id: status-draft
    title: 'Status: Draft'
    level: 2
  - id: story
    title: Story
    level: 2
    content: |-
      As a {{user_type}},
      I want {{enhancement_capability}},
      so that {{value_delivered}}.
  - id: context-source
    title: Context Source
    level: 2
    content: |-
      - Source Document: {{document name/type}}
      - Enhancement Type: {{single feature/bug fix/integration/etc}}
      - Existing System Impact: {{brief assessment}}
      ```
    sections:
    - id: 3-2-develop-acceptance-criteria
      title: 3.2 Develop Acceptance Criteria
      level: 4
      content: |-
        Critical: For brownfield, ALWAYS include criteria about maintaining existing functionality

        Standard structure:

        1. New functionality works as specified
        2. Existing {{affected feature}} continues to work unchanged
        3. Integration with {{existing system}} maintains current behavior
        4. No regression in {{related area}}
        5. Performance remains within acceptable bounds
    - id: 3-3-gather-technical-guidance
      title: 3.3 Gather Technical Guidance
      level: 4
      content: |-
        Critical: This is where you'll need to be interactive with the user if information is missing

        Create Dev Technical Guidance section with available information:

        ````markdown
  - id: dev-technical-guidance
    title: Dev Technical Guidance
    level: 2
    sections:
    - id: existing-system-context
      title: Existing System Context
      level: 3
      content: '[Extract from available documentation]'
    - id: integration-approach
      title: Integration Approach
      level: 3
      content: '[Based on patterns found or ask user]'
    - id: technical-constraints
      title: Technical Constraints
      level: 3
      content: '[From documentation or user input]'
    - id: missing-information
      title: Missing Information
      level: 3
      content: 'Critical: List anything you couldn''t find that dev will need and
        ask for the missing information'
    - id: 4-task-generation-with-safety-checks
      title: 4. Task Generation with Safety Checks
      level: 3
      sections:
      - id: 4-1-generate-implementation-tasks
        title: 4.1 Generate Implementation Tasks
        level: 4
        content: |-
          Based on gathered context, create tasks that:

          - Include exploration tasks if system understanding is incomplete
          - Add verification tasks for existing functionality
          - Include rollback considerations
          - Reference specific files/patterns when known

          Example task structure for brownfield:

          ```markdown
  - id: tasks-subtasks
    title: Tasks / Subtasks
    level: 2
    content: |-
      - [ ] Task 1: Analyze existing {{component/feature}} implementation
        - [ ] Review {{specific files}} for current patterns
        - [ ] Document integration points
        - [ ] Identify potential impacts

      - [ ] Task 2: Implement {{new functionality}}
        - [ ] Follow pattern from {{example file}}
        - [ ] Integrate with {{existing component}}
        - [ ] Maintain compatibility with {{constraint}}

      - [ ] Task 3: Verify existing functionality
        - [ ] Test {{existing feature 1}} still works
        - [ ] Verify {{integration point}} behavior unchanged
        - [ ] Check performance impact

      - [ ] Task 4: Add tests
        - [ ] Unit tests following {{project test pattern}}
        - [ ] Integration test for {{integration point}}
        - [ ] Update existing tests if needed
      ```
      ````
    sections:
    - id: 5-risk-assessment-and-mitigation
      title: 5. Risk Assessment and Mitigation
      level: 3
      content: |-
        CRITICAL: for brownfield - always include risk assessment

        Add section for brownfield-specific risks:

        ```markdown
  - id: risk-assessment
    title: Risk Assessment
    level: 2
    sections:
    - id: implementation-risks
      title: Implementation Risks
      level: 3
      content: |-
        - **Primary Risk**: {{main risk to existing system}}
        - **Mitigation**: {{how to address}}
        - **Verification**: {{how to confirm safety}}
    - id: rollback-plan
      title: Rollback Plan
      level: 3
      content: '- {{Simple steps to undo changes if needed}}'
    - id: safety-checks
      title: Safety Checks
      level: 3
      content: |-
        - [ ] Existing {{feature}} tested before changes
        - [ ] Changes can be feature-flagged or isolated
        - [ ] Rollback procedure documented
        ```
    - id: 6-final-story-validation
      title: 6. Final Story Validation
      level: 3
      content: |-
        Before finalizing:

        1. **Completeness Check**:
           - [ ] Story has clear scope and acceptance criteria
           - [ ] Technical context is sufficient for implementation
           - [ ] Integration approach is defined
           - [ ] Risks are identified with mitigation

        2. **Safety Check**:
           - [ ] Existing functionality protection included
           - [ ] Rollback plan is feasible
           - [ ] Testing covers both new and existing features

        3. **Information Gaps**:
           - [ ] All critical missing information gathered from user
           - [ ] Remaining unknowns documented for dev agent
           - [ ] Exploration tasks added where needed
    - id: 7-story-output-format
      title: 7. Story Output Format
      level: 3
      content: |-
        Save the story with appropriate naming:

        - If from epic: `docs/stories/epic-{n}-story-{m}.yaml`
        - If standalone: `docs/stories/brownfield-{feature-name}.yaml`
        - If sequential: Follow existing story numbering

        Include header noting documentation context:

        ```markdown
- id: story-title
  title: 'Story: {{Title}}'
  level: 1
  sections:
  - id: status-draft-2
    title: 'Status: Draft'
    level: 2
    content: |-
      [Rest of story content...]
      ```
    sections:
    - id: 8-handoff-communication
      title: 8. Handoff Communication
      level: 3
      content: |-
        Provide clear handoff to the user:

        ```text
        Brownfield story created: {{story title}}

        Source Documentation: {{what was used}}
        Story Location: {{file path}}

        Key Integration Points Identified:
        - {{integration point 1}}
        - {{integration point 2}}

        Risks Noted:
        - {{primary risk}}

        {{If missing info}}:
        Note: Some technical details were unclear. The story includes exploration tasks to gather needed information during implementation.

        Next Steps:
        1. Review story for accuracy
        2. Verify integration approach aligns with your system
        3. Approve story or request adjustments
        4. Dev agent can then implement with safety checks
        ```
  - id: success-criteria
    title: Success Criteria
    level: 2
    content: |-
      The brownfield story creation is successful when:

      1. Story can be implemented without requiring dev to search multiple documents
      2. Integration approach is clear and safe for existing system
      3. All available technical context has been extracted and organized
      4. Missing information has been identified and addressed
      5. Risks are documented with mitigation strategies
      6. Story includes verification of existing functionality
      7. Rollback approach is defined
  - id: important-notes
    title: Important Notes
    level: 2
    content: |-
      - This task is specifically for brownfield projects with non-standard documentation
      - Always prioritize existing system stability over new features
      - When in doubt, add exploration and verification tasks
      - It's better to ask the user for clarification than make assumptions
      - Each story should be self-contained for the dev agent
      - Include references to existing code patterns when available
