- id: enhanced-ide-development-workflow
  title: Enhanced IDE Development Workflow
  level: 1
  content: This is a simple step-by-step guide to help you efficiently manage your
    development workflow using the BMad Method. The workflow integrates the Test Architect
    (QA agent) throughout the development lifecycle to ensure quality, prevent regressions,
    and maintain high standards. Refer to the **[<ins>User Guide</ins>](user-guide.yaml)**
    for any scenario that is not covered here.
  sections:
  - id: create-new-branch
    title: Create New Branch
    level: 2
    content: 1. **Start new branch**
  - id: story-creation-scrum-master
    title: Story Creation (Scrum Master)
    level: 2
    content: |-
      1. **Start new chat/conversation**
      2. **Load SM agent**
      3. **Execute**: `*draft` (runs create-next-story task)
      4. **Review generated story** in `docs/stories/`
      5. **Update status**: Change from "Draft" to "Approved"
  - id: story-implementation-developer
    title: Story Implementation (Developer)
    level: 2
    content: |-
      1. **Start new chat/conversation**
      2. **Load Dev agent**
      3. **Execute**: `*develop-story {selected-story}` (runs execute-checklist task)
      4. **Review generated report** in `{selected-story}`
  - id: test-architect-integration-throughout-workflow
    title: Test Architect Integration Throughout Workflow
    level: 2
    content: |-
      The Test Architect (Quinn) provides comprehensive quality assurance throughout the development lifecycle. Here's how to leverage each capability at the right time.

      **Command Aliases:** Documentation uses short forms (`*risk`, `*design`, `*nfr`, `*trace`) for the full commands (`*risk-profile`, `*test-design`, `*nfr-assess`, `*trace-requirements`).
    sections:
    - id: quick-command-reference
      title: Quick Command Reference
      level: 3
      content: |-
        | **Stage**                | **Command** | **Purpose**                             | **Output**                                                      | **Priority**                |
        | ------------------------ | ----------- | --------------------------------------- | --------------------------------------------------------------- | --------------------------- |
        | **After Story Approval** | `*risk`     | Identify integration & regression risks | `docs/qa/assessments/{epic}.{story}-risk-{YYYYMMDD}.yaml`         | High for complex/brownfield |
        |                          | `*design`   | Create test strategy for dev            | `docs/qa/assessments/{epic}.{story}-test-design-{YYYYMMDD}.yaml`  | High for new features       |
        | **During Development**   | `*trace`    | Verify test coverage                    | `docs/qa/assessments/{epic}.{story}-trace-{YYYYMMDD}.yaml`        | Medium                      |
        |                          | `*nfr`      | Validate quality attributes             | `docs/qa/assessments/{epic}.{story}-nfr-{YYYYMMDD}.yaml`          | High for critical features  |
        | **After Development**    | `*review`   | Comprehensive assessment                | QA Results in story + `docs/qa/gates/{epic}.{story}-{slug}.yml` | **Required**                |
        | **Post-Review**          | `*gate`     | Update quality decision                 | Updated `docs/qa/gates/{epic}.{story}-{slug}.yml`               | As needed                   |
    - id: stage-1-after-story-creation-before-dev-starts
      title: 'Stage 1: After Story Creation (Before Dev Starts)'
      level: 3
      content: |-
        **RECOMMENDED - Set Developer Up for Success:**

