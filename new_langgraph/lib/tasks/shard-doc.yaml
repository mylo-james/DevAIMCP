sections:
- id: document-sharding-task
  title: Document Sharding Task
  level: 1
  sections:
  - id: purpose
    title: Purpose
    level: 2
    content: |-
      - Split a large document into multiple smaller documents based on level 2 sections
      - Create a folder structure to organize the sharded documents
      - Maintain all content integrity including code blocks, diagrams, and markdown formatting
  - id: primary-method-automatic-with-markdown-tree
    title: 'Primary Method: Automatic with markdown-tree'
    level: 2
    content: |-
      [[LLM: First, check if markdownExploder is set to true in .bmad-core/core-config.yaml. If it is, attempt to run the command: `md-tree explode {input file} {output path}`.

      If the command succeeds, inform the user that the document has been sharded successfully and STOP - do not proceed further.

      If the command fails (especially with an error indicating the command is not found or not available), inform the user: "The markdownExploder setting is enabled but the md-tree command is not available. Please either:

      1. Install @kayvan/markdown-tree-parser globally with: `npm install -g @kayvan/markdown-tree-parser`
      2. Or set markdownExploder to false in .bmad-core/core-config.yaml

      **IMPORTANT: STOP HERE - do not proceed with manual sharding until one of the above actions is taken.**"

      If markdownExploder is set to false, inform the user: "The markdownExploder setting is currently false. For better performance and reliability, you should:

      1. Set markdownExploder to true in .bmad-core/core-config.yaml
      2. Install @kayvan/markdown-tree-parser globally with: `npm install -g @kayvan/markdown-tree-parser`

      I will now proceed with the manual sharding process."

      Then proceed with the manual method below ONLY if markdownExploder is false.]]
    sections:
    - id: installation-and-usage
      title: Installation and Usage
      level: 3
      content: |-
        1. **Install globally**:

           ```bash
           npm install -g @kayvan/markdown-tree-parser
           ```

        2. **Use the explode command**:

           ```bash
           # For PRD
           md-tree explode docs/prd.yaml docs/prd

           # For Architecture
           md-tree explode docs/architecture.yaml docs/architecture

           # For any document
           md-tree explode [source-document] [destination-folder]
           ```

        3. **What it does**:
           - Automatically splits the document by level 2 sections
           - Creates properly named files
           - Adjusts heading levels appropriately
           - Handles all edge cases with code blocks and special markdown

        If the user has @kayvan/markdown-tree-parser installed, use it and skip the manual process below.

        ---
  - id: manual-method-if-kayvan-markdown-tree-parser-is-not-available-or-user-indicated-manual-method
    title: Manual Method (if @kayvan/markdown-tree-parser is not available or user
      indicated manual method)
    level: 2
    sections:
    - id: task-instructions
      title: Task Instructions
      level: 3
      content: |-
        1. Identify Document and Target Location

        - Determine which document to shard (user-provided path)
        - Create a new folder under `docs/` with the same name as the document (without extension)
        - Example: `docs/prd.yaml` → create folder `docs/prd/`

        2. Parse and Extract Sections

        CRITICAL AEGNT SHARDING RULES:

        1. Read the entire document content
        2. Identify all level 2 sections (## headings)
        3. For each level 2 section:
           - Extract the section heading and ALL content until the next level 2 section
           - Include all subsections, code blocks, diagrams, lists, tables, etc.
           - Be extremely careful with:
             - Fenced code blocks (```) - ensure you capture the full block including closing backticks and account for potential misleading level 2's that are actually part of a fenced section example
             - Mermaid diagrams - preserve the complete diagram syntax
             - Nested markdown elements
             - Multi-line content that might contain ## inside code blocks

        CRITICAL: Use proper parsing that understands markdown context. A ## inside a code block is NOT a section header.]]
    - id: 3-create-individual-files
      title: 3. Create Individual Files
      level: 3
      content: |-
        For each extracted section:

        1. **Generate filename**: Convert the section heading to lowercase-dash-case
           - Remove special characters
           - Replace spaces with dashes
           - Example: "## Tech Stack" → `tech-stack.yaml`

        2. **Adjust heading levels**:
           - The level 2 heading becomes level 1 (# instead of ##) in the sharded new document
           - All subsection levels decrease by 1:

           ```txt
             - ### → ##
             - #### → ###
             - ##### → ####
             - etc.
           ```

        3. **Write content**: Save the adjusted content to the new file
    - id: 4-create-index-file
      title: 4. Create Index File
      level: 3
      content: |-
        Create an `index.yaml` file in the sharded folder that:

        1. Contains the original level 1 heading and any content before the first level 2 section
        2. Lists all the sharded files with links:

        ```markdown
- id: original-document-title
  title: Original Document Title
  level: 1
  content: '[Original introduction content if any]'
  sections:
  - id: sections
    title: Sections
    level: 2
    content: |-
      - [Section Name 1](./section-name-1.yaml)
      - [Section Name 2](./section-name-2.yaml)
      - [Section Name 3](./section-name-3.yaml)
        ...
      ```
    sections:
    - id: 5-preserve-special-content
      title: 5. Preserve Special Content
      level: 3
      content: |-
        1. **Code blocks**: Must capture complete blocks including:

           ```language
           content
           ```

        2. **Mermaid diagrams**: Preserve complete syntax:

           ```mermaid
           graph TD
           ...
           ```

        3. **Tables**: Maintain proper markdown table formatting

        4. **Lists**: Preserve indentation and nesting

        5. **Inline code**: Preserve backticks

        6. **Links and references**: Keep all markdown links intact

        7. **Template markup**: If documents contain {{placeholders}} ,preserve exactly
    - id: 6-validation
      title: 6. Validation
      level: 3
      content: |-
        After sharding:

        1. Verify all sections were extracted
        2. Check that no content was lost
        3. Ensure heading levels were properly adjusted
        4. Confirm all files were created successfully
    - id: 7-report-results
      title: 7. Report Results
      level: 3
      content: |-
        Provide a summary:

        ```text
        Document sharded successfully:
        - Source: [original document path]
        - Destination: docs/[folder-name]/
        - Files created: [count]
        - Sections:
          - section-name-1.yaml: "Section Title 1"
          - section-name-2.yaml: "Section Title 2"
          ...
        ```
  - id: important-notes
    title: Important Notes
    level: 2
    content: |-
      - Never modify the actual content, only adjust heading levels
      - Preserve ALL formatting, including whitespace where significant
      - Handle edge cases like sections with code blocks containing ## symbols
      - Ensure the sharding is reversible (could reconstruct the original from shards)
