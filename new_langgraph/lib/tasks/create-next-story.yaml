type: task
id: new_langgraph/lib/tasks/create-next-story
title: Create Next Story Task
version: 1
source_path: new_langgraph/lib/tasks/create-next-story.yaml
summary: To identify the next logical story based on project progress and epic definitions,
  and then to prepare a comprehensive, self-contained, and actionable story file using
  the `Story Template`. This task ensures the story is enriched with all necessary
  technical context, requirements, and acceptance criteria, making it ready for efficient
  implementation by a Developer Agent with minimal need for additional research or
  finding its own context.
metadata:
  powered_by: BMAD Core
  content_format: markdown
  original_extension: md
  converted_at: '2025-09-22'
  legacy_path: new_langgraph/lib/tasks/create-next-story.md
sections:
- id: create-next-story-task
  title: Create Next Story Task
  level: 1
  sections:
  - id: purpose
    title: Purpose
    level: 2
    content: To identify the next logical story based on project progress and epic
      definitions, and then to prepare a comprehensive, self-contained, and actionable
      story file using the `Story Template`. This task ensures the story is enriched
      with all necessary technical context, requirements, and acceptance criteria,
      making it ready for efficient implementation by a Developer Agent with minimal
      need for additional research or finding its own context.
  - id: sequential-task-execution-do-not-proceed-until-current-task-is-complete
    title: SEQUENTIAL Task Execution (Do not proceed until current Task is complete)
    level: 2
    sections:
    - id: 0-load-core-configuration-and-check-workflow
      title: 0. Load Core Configuration and Check Workflow
      level: 3
      content: |-
        - Load `.bmad-core/core-config.yaml` from the project root
        - If the file does not exist, HALT and inform the user: "core-config.yaml not found. This file is required for story creation. You can either: 1) Copy it from GITHUB bmad-core/core-config.yaml and configure it for your project OR 2) Run the BMad installer against your project to upgrade and add the file automatically. Please add and configure core-config.yaml before proceeding."
        - Extract key configurations: `devStoryLocation`, `prd.*`, `architecture.*`, `workflow.*`
    - id: 1-identify-next-story-for-preparation
      title: 1. Identify Next Story for Preparation
      level: 3
      sections:
      - id: 1-1-locate-epic-files-and-review-existing-stories
        title: 1.1 Locate Epic Files and Review Existing Stories
        level: 4
        content: |-
          - Based on `prdSharded` from config, locate epic files (sharded location/pattern or monolithic PRD sections)
          - If `devStoryLocation` has story files, load the highest `{epicNum}.{storyNum}.story.yaml` file
          - **If highest story exists:**
            - Verify status is 'Done'. If not, alert user: "ALERT: Found incomplete story! File: {lastEpicNum}.{lastStoryNum}.story.yaml Status: [current status] You should fix this story first, but would you like to accept risk & override to create the next story in draft?"
            - If proceeding, select next sequential story in the current epic
            - If epic is complete, prompt user: "Epic {epicNum} Complete: All stories in Epic {epicNum} have been completed. Would you like to: 1) Begin Epic {epicNum + 1} with story 1 2) Select a specific story to work on 3) Cancel story creation"
            - **CRITICAL**: NEVER automatically skip to another epic. User MUST explicitly instruct which story to create.
          - **If no story files exist:** The next story is ALWAYS 1.1 (first story of first epic)
          - Announce the identified story to the user: "Identified next story for preparation: {epicNum}.{storyNum} - {Story Title}"
    - id: 2-gather-story-requirements-and-previous-story-context
      title: 2. Gather Story Requirements and Previous Story Context
      level: 3
      content: |-
        - Extract story requirements from the identified epic file
        - If previous story exists, review Dev Agent Record sections for:
          - Completion Notes and Debug Log References
          - Implementation deviations and technical decisions
          - Challenges encountered and lessons learned
        - Extract relevant insights that inform the current story's preparation
    - id: 3-gather-architecture-context
      title: 3. Gather Architecture Context
      level: 3
      sections:
      - id: 3-1-determine-architecture-reading-strategy
        title: 3.1 Determine Architecture Reading Strategy
        level: 4
        content: |-
          - **If `architectureVersion: >= v4` and `architectureSharded: true`**: Read `{architectureShardedLocation}/index.yaml` then follow structured reading order below
          - **Else**: Use monolithic `architectureFile` for similar sections
      - id: 3-2-read-architecture-documents-based-on-story-type
        title: 3.2 Read Architecture Documents Based on Story Type
        level: 4
        content: |-
          **For ALL Stories:** tech-stack.yaml, unified-project-structure.yaml, coding-standards.yaml, testing-strategy.yaml

          **For Backend/API Stories, additionally:** data-models.yaml, database-schema.yaml, backend-architecture.yaml, rest-api-spec.yaml, external-apis.yaml

          **For Frontend/UI Stories, additionally:** frontend-architecture.yaml, components.yaml, core-workflows.yaml, data-models.yaml

          **For Full-Stack Stories:** Read both Backend and Frontend sections above
      - id: 3-3-extract-story-specific-technical-details
        title: 3.3 Extract Story-Specific Technical Details
        level: 4
        content: |-
          Extract ONLY information directly relevant to implementing the current story. Do NOT invent new libraries, patterns, or standards not in the source documents.

          Extract:

          - Specific data models, schemas, or structures the story will use
          - API endpoints the story must implement or consume
          - Component specifications for UI elements in the story
          - File paths and naming conventions for new code
          - Testing requirements specific to the story's features
          - Security or performance considerations affecting the story

          ALWAYS cite source documents: `[Source: architecture/{filename}.yaml#{section}]`
    - id: 4-verify-project-structure-alignment
      title: 4. Verify Project Structure Alignment
      level: 3
      content: |-
        - Cross-reference story requirements with Project Structure Guide from `docs/architecture/unified-project-structure.yaml`
        - Ensure file paths, component locations, or module names align with defined structures
        - Document any structural conflicts in "Project Structure Notes" section within the story draft
    - id: 5-populate-story-template-with-full-context
      title: 5. Populate Story Template with Full Context
      level: 3
      content: |-
        - Create new story file: `{devStoryLocation}/{epicNum}.{storyNum}.story.yaml` using Story Template
        - Fill in basic story information: Title, Status (Draft), Story statement, Acceptance Criteria from Epic
        - **`Dev Notes` section (CRITICAL):**
          - CRITICAL: This section MUST contain ONLY information extracted from architecture documents. NEVER invent or assume technical details.
          - Include ALL relevant technical details from Steps 2-3, organized by category:
            - **Previous Story Insights**: Key learnings from previous story
            - **Data Models**: Specific schemas, validation rules, relationships [with source references]
            - **API Specifications**: Endpoint details, request/response formats, auth requirements [with source references]
            - **Component Specifications**: UI component details, props, state management [with source references]
            - **File Locations**: Exact paths where new code should be created based on project structure
            - **Testing Requirements**: Specific test cases or strategies from testing-strategy.yaml
            - **Technical Constraints**: Version requirements, performance considerations, security rules
          - Every technical detail MUST include its source reference: `[Source: architecture/{filename}.yaml#{section}]`
          - If information for a category is not found in the architecture docs, explicitly state: "No specific guidance found in architecture docs"
        - **`Tasks / Subtasks` section:**
          - Generate detailed, sequential list of technical tasks based ONLY on: Epic Requirements, Story AC, Reviewed Architecture Information
          - Each task must reference relevant architecture documentation
          - Include unit testing as explicit subtasks based on the Testing Strategy
          - Link tasks to ACs where applicable (e.g., `Task 1 (AC: 1, 3)`)
        - Add notes on project structure alignment or discrepancies found in Step 4
    - id: 6-story-draft-completion-and-review
      title: 6. Story Draft Completion and Review
      level: 3
      content: |-
        - Review all sections for completeness and accuracy
        - Verify all source references are included for technical details
        - Ensure tasks align with both epic requirements and architecture constraints
        - Update status to "Draft" and save the story file
        - Execute `.bmad-core/tasks/execute-checklist` `.bmad-core/checklists/story-draft-checklist`
        - Provide summary to user including:
          - Story created: `{devStoryLocation}/{epicNum}.{storyNum}.story.yaml`
          - Status: Draft
          - Key technical components included from architecture docs
          - Any deviations or conflicts noted between epic and architecture
          - Checklist Results
          - Next steps: For Complex stories, suggest the user carefully review the story draft and also optionally have the PO run the task `.bmad-core/tasks/validate-next-story`
