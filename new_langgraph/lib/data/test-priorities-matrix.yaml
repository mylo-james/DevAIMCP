sections:
- id: test-priorities-matrix
  title: Test Priorities Matrix
  level: 1
  content: Guide for prioritizing test scenarios based on risk, criticality, and business
    impact.
  sections:
  - id: priority-levels
    title: Priority Levels
    level: 2
    sections:
    - id: p0-critical-must-test
      title: P0 - Critical (Must Test)
      level: 3
      content: |-
        **Criteria:**

        - Revenue-impacting functionality
        - Security-critical paths
        - Data integrity operations
        - Regulatory compliance requirements
        - Previously broken functionality (regression prevention)

        **Examples:**

        - Payment processing
        - Authentication/authorization
        - User data creation/deletion
        - Financial calculations
        - GDPR/privacy compliance

        **Testing Requirements:**

        - Comprehensive coverage at all levels
        - Both happy and unhappy paths
        - Edge cases and error scenarios
        - Performance under load
    - id: p1-high-should-test
      title: P1 - High (Should Test)
      level: 3
      content: |-
        **Criteria:**

        - Core user journeys
        - Frequently used features
        - Features with complex logic
        - Integration points between systems
        - Features affecting user experience

        **Examples:**

        - User registration flow
        - Search functionality
        - Data import/export
        - Notification systems
        - Dashboard displays

        **Testing Requirements:**

        - Primary happy paths required
        - Key error scenarios
        - Critical edge cases
        - Basic performance validation
    - id: p2-medium-nice-to-test
      title: P2 - Medium (Nice to Test)
      level: 3
      content: |-
        **Criteria:**

        - Secondary features
        - Admin functionality
        - Reporting features
        - Configuration options
        - UI polish and aesthetics

        **Examples:**

        - Admin settings panels
        - Report generation
        - Theme customization
        - Help documentation
        - Analytics tracking

        **Testing Requirements:**

        - Happy path coverage
        - Basic error handling
        - Can defer edge cases
    - id: p3-low-test-if-time-permits
      title: P3 - Low (Test if Time Permits)
      level: 3
      content: |-
        **Criteria:**

        - Rarely used features
        - Nice-to-have functionality
        - Cosmetic issues
        - Non-critical optimizations

        **Examples:**

        - Advanced preferences
        - Legacy feature support
        - Experimental features
        - Debug utilities

        **Testing Requirements:**

        - Smoke tests only
        - Can rely on manual testing
        - Document known limitations
  - id: risk-based-priority-adjustments
    title: Risk-Based Priority Adjustments
    level: 2
    sections:
    - id: increase-priority-when
      title: 'Increase Priority When:'
      level: 3
      content: |-
        - High user impact (affects >50% of users)
        - High financial impact (>$10K potential loss)
        - Security vulnerability potential
        - Compliance/legal requirements
        - Customer-reported issues
        - Complex implementation (>500 LOC)
        - Multiple system dependencies
    - id: decrease-priority-when
      title: 'Decrease Priority When:'
      level: 3
      content: |-
        - Feature flag protected
        - Gradual rollout planned
        - Strong monitoring in place
        - Easy rollback capability
        - Low usage metrics
        - Simple implementation
        - Well-isolated component
  - id: test-coverage-by-priority
    title: Test Coverage by Priority
    level: 2
    content: |-
      | Priority | Unit Coverage | Integration Coverage | E2E Coverage       |
      | -------- | ------------- | -------------------- | ------------------ |
      | P0       | >90%          | >80%                 | All critical paths |
      | P1       | >80%          | >60%                 | Main happy paths   |
      | P2       | >60%          | >40%                 | Smoke tests        |
      | P3       | Best effort   | Best effort          | Manual only        |
  - id: priority-assignment-rules
    title: Priority Assignment Rules
    level: 2
    content: |-
      1. **Start with business impact** - What happens if this fails?
      2. **Consider probability** - How likely is failure?
      3. **Factor in detectability** - Would we know if it failed?
      4. **Account for recoverability** - Can we fix it quickly?
  - id: priority-decision-tree
    title: Priority Decision Tree
    level: 2
    content: |-
      ```
      Is it revenue-critical?
      ├─ YES → P0
      └─ NO → Does it affect core user journey?
          ├─ YES → Is it high-risk?
          │   ├─ YES → P0
          │   └─ NO → P1
          └─ NO → Is it frequently used?
              ├─ YES → P1
              └─ NO → Is it customer-facing?
                  ├─ YES → P2
                  └─ NO → P3
      ```
  - id: test-execution-order
    title: Test Execution Order
    level: 2
    content: |-
      1. Execute P0 tests first (fail fast on critical issues)
      2. Execute P1 tests second (core functionality)
      3. Execute P2 tests if time permits
      4. P3 tests only in full regression cycles
  - id: continuous-adjustment
    title: Continuous Adjustment
    level: 2
    content: |-
      Review and adjust priorities based on:

      - Production incident patterns
      - User feedback and complaints
      - Usage analytics
      - Test failure history
      - Business priority changes
