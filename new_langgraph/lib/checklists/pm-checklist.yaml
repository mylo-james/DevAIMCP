sections:
- id: product-manager-pm-requirements-checklist
  title: Product Manager (PM) Requirements Checklist
  level: 1
  content: |-
    This checklist serves as a comprehensive framework to ensure the Product Requirements Document (PRD) and Epic definitions are complete, well-structured, and appropriately scoped for MVP development. The PM should systematically work through each item during the product definition process.

    [[LLM: INITIALIZATION INSTRUCTIONS - PM CHECKLIST

    Before proceeding with this checklist, ensure you have access to:

    1. prd.yaml - The Product Requirements Document (check docs/prd.yaml)
    2. Any user research, market analysis, or competitive analysis documents
    3. Business goals and strategy documents
    4. Any existing epic definitions or user stories

    IMPORTANT: If the PRD is missing, immediately ask the user for its location or content before proceeding.

    VALIDATION APPROACH:

    1. User-Centric - Every requirement should tie back to user value
    2. MVP Focus - Ensure scope is truly minimal while viable
    3. Clarity - Requirements should be unambiguous and testable
    4. Completeness - All aspects of the product vision are covered
    5. Feasibility - Requirements are technically achievable

    EXECUTION MODE:
    Ask the user if they want to work through the checklist:

    - Section by section (interactive mode) - Review each section, present findings, get confirmation before proceeding
    - All at once (comprehensive mode) - Complete full analysis and present comprehensive report at end]]
  sections:
  - id: 1-problem-definition-context
    title: 1. PROBLEM DEFINITION & CONTEXT
    level: 2
    content: |-
      [[LLM: The foundation of any product is a clear problem statement. As you review this section:

      1. Verify the problem is real and worth solving
      2. Check that the target audience is specific, not "everyone"
      3. Ensure success metrics are measurable, not vague aspirations
      4. Look for evidence of user research, not just assumptions
      5. Confirm the problem-solution fit is logical]]
    sections:
    - id: 1-1-problem-statement
      title: 1.1 Problem Statement
      level: 3
      content: |-
        - [ ] Clear articulation of the problem being solved
        - [ ] Identification of who experiences the problem
        - [ ] Explanation of why solving this problem matters
        - [ ] Quantification of problem impact (if possible)
        - [ ] Differentiation from existing solutions
    - id: 1-2-business-goals-success-metrics
      title: 1.2 Business Goals & Success Metrics
      level: 3
      content: |-
        - [ ] Specific, measurable business objectives defined
        - [ ] Clear success metrics and KPIs established
        - [ ] Metrics are tied to user and business value
        - [ ] Baseline measurements identified (if applicable)
        - [ ] Timeframe for achieving goals specified
    - id: 1-3-user-research-insights
      title: 1.3 User Research & Insights
      level: 3
      content: |-
        - [ ] Target user personas clearly defined
        - [ ] User needs and pain points documented
        - [ ] User research findings summarized (if available)
        - [ ] Competitive analysis included
        - [ ] Market context provided
  - id: 2-mvp-scope-definition
    title: 2. MVP SCOPE DEFINITION
    level: 2
    content: |-
      [[LLM: MVP scope is critical - too much and you waste resources, too little and you can't validate. Check:

      1. Is this truly minimal? Challenge every feature
      2. Does each feature directly address the core problem?
      3. Are "nice-to-haves" clearly separated from "must-haves"?
      4. Is the rationale for inclusion/exclusion documented?
      5. Can you ship this in the target timeframe?]]
    sections:
    - id: 2-1-core-functionality
      title: 2.1 Core Functionality
      level: 3
      content: |-
        - [ ] Essential features clearly distinguished from nice-to-haves
        - [ ] Features directly address defined problem statement
        - [ ] Each Epic ties back to specific user needs
        - [ ] Features and Stories are described from user perspective
        - [ ] Minimum requirements for success defined
    - id: 2-2-scope-boundaries
      title: 2.2 Scope Boundaries
      level: 3
      content: |-
        - [ ] Clear articulation of what is OUT of scope
        - [ ] Future enhancements section included
        - [ ] Rationale for scope decisions documented
        - [ ] MVP minimizes functionality while maximizing learning
        - [ ] Scope has been reviewed and refined multiple times
    - id: 2-3-mvp-validation-approach
      title: 2.3 MVP Validation Approach
      level: 3
      content: |-
        - [ ] Method for testing MVP success defined
        - [ ] Initial user feedback mechanisms planned
        - [ ] Criteria for moving beyond MVP specified
        - [ ] Learning goals for MVP articulated
        - [ ] Timeline expectations set
  - id: 3-user-experience-requirements
    title: 3. USER EXPERIENCE REQUIREMENTS
    level: 2
    content: |-
      [[LLM: UX requirements bridge user needs and technical implementation. Validate:

      1. User flows cover the primary use cases completely
      2. Edge cases are identified (even if deferred)
      3. Accessibility isn't an afterthought
      4. Performance expectations are realistic
      5. Error states and recovery are planned]]
    sections:
    - id: 3-1-user-journeys-flows
      title: 3.1 User Journeys & Flows
      level: 3
      content: |-
        - [ ] Primary user flows documented
        - [ ] Entry and exit points for each flow identified
        - [ ] Decision points and branches mapped
        - [ ] Critical path highlighted
        - [ ] Edge cases considered
    - id: 3-2-usability-requirements
      title: 3.2 Usability Requirements
      level: 3
      content: |-
        - [ ] Accessibility considerations documented
        - [ ] Platform/device compatibility specified
        - [ ] Performance expectations from user perspective defined
        - [ ] Error handling and recovery approaches outlined
        - [ ] User feedback mechanisms identified
    - id: 3-3-ui-requirements
      title: 3.3 UI Requirements
      level: 3
      content: |-
        - [ ] Information architecture outlined
        - [ ] Critical UI components identified
        - [ ] Visual design guidelines referenced (if applicable)
        - [ ] Content requirements specified
        - [ ] High-level navigation structure defined
  - id: 4-functional-requirements
    title: 4. FUNCTIONAL REQUIREMENTS
    level: 2
    content: |-
      [[LLM: Functional requirements must be clear enough for implementation. Check:

      1. Requirements focus on WHAT not HOW (no implementation details)
      2. Each requirement is testable (how would QA verify it?)
      3. Dependencies are explicit (what needs to be built first?)
      4. Requirements use consistent terminology
      5. Complex features are broken into manageable pieces]]
    sections:
    - id: 4-1-feature-completeness
      title: 4.1 Feature Completeness
      level: 3
      content: |-
        - [ ] All required features for MVP documented
        - [ ] Features have clear, user-focused descriptions
        - [ ] Feature priority/criticality indicated
        - [ ] Requirements are testable and verifiable
        - [ ] Dependencies between features identified
    - id: 4-2-requirements-quality
      title: 4.2 Requirements Quality
      level: 3
      content: |-
        - [ ] Requirements are specific and unambiguous
        - [ ] Requirements focus on WHAT not HOW
        - [ ] Requirements use consistent terminology
        - [ ] Complex requirements broken into simpler parts
        - [ ] Technical jargon minimized or explained
    - id: 4-3-user-stories-acceptance-criteria
      title: 4.3 User Stories & Acceptance Criteria
      level: 3
      content: |-
        - [ ] Stories follow consistent format
        - [ ] Acceptance criteria are testable
        - [ ] Stories are sized appropriately (not too large)
        - [ ] Stories are independent where possible
        - [ ] Stories include necessary context
        - [ ] Local testability requirements (e.g., via CLI) defined in ACs for relevant backend/data stories
  - id: 5-non-functional-requirements
    title: 5. NON-FUNCTIONAL REQUIREMENTS
    level: 2
    sections:
    - id: 5-1-performance-requirements
      title: 5.1 Performance Requirements
      level: 3
      content: |-
        - [ ] Response time expectations defined
        - [ ] Throughput/capacity requirements specified
        - [ ] Scalability needs documented
        - [ ] Resource utilization constraints identified
        - [ ] Load handling expectations set
    - id: 5-2-security-compliance
      title: 5.2 Security & Compliance
      level: 3
      content: |-
        - [ ] Data protection requirements specified
        - [ ] Authentication/authorization needs defined
        - [ ] Compliance requirements documented
        - [ ] Security testing requirements outlined
        - [ ] Privacy considerations addressed
    - id: 5-3-reliability-resilience
      title: 5.3 Reliability & Resilience
      level: 3
      content: |-
        - [ ] Availability requirements defined
        - [ ] Backup and recovery needs documented
        - [ ] Fault tolerance expectations set
        - [ ] Error handling requirements specified
        - [ ] Maintenance and support considerations included
    - id: 5-4-technical-constraints
      title: 5.4 Technical Constraints
      level: 3
      content: |-
        - [ ] Platform/technology constraints documented
        - [ ] Integration requirements outlined
        - [ ] Third-party service dependencies identified
        - [ ] Infrastructure requirements specified
        - [ ] Development environment needs identified
  - id: 6-epic-story-structure
    title: 6. EPIC & STORY STRUCTURE
    level: 2
    sections:
    - id: 6-1-epic-definition
      title: 6.1 Epic Definition
      level: 3
      content: |-
        - [ ] Epics represent cohesive units of functionality
        - [ ] Epics focus on user/business value delivery
        - [ ] Epic goals clearly articulated
        - [ ] Epics are sized appropriately for incremental delivery
        - [ ] Epic sequence and dependencies identified
    - id: 6-2-story-breakdown
      title: 6.2 Story Breakdown
      level: 3
      content: |-
        - [ ] Stories are broken down to appropriate size
        - [ ] Stories have clear, independent value
        - [ ] Stories include appropriate acceptance criteria
        - [ ] Story dependencies and sequence documented
        - [ ] Stories aligned with epic goals
    - id: 6-3-first-epic-completeness
      title: 6.3 First Epic Completeness
      level: 3
      content: |-
        - [ ] First epic includes all necessary setup steps
        - [ ] Project scaffolding and initialization addressed
        - [ ] Core infrastructure setup included
        - [ ] Development environment setup addressed
        - [ ] Local testability established early
  - id: 7-technical-guidance
    title: 7. TECHNICAL GUIDANCE
    level: 2
    sections:
    - id: 7-1-architecture-guidance
      title: 7.1 Architecture Guidance
      level: 3
      content: |-
        - [ ] Initial architecture direction provided
        - [ ] Technical constraints clearly communicated
        - [ ] Integration points identified
        - [ ] Performance considerations highlighted
        - [ ] Security requirements articulated
        - [ ] Known areas of high complexity or technical risk flagged for architectural deep-dive
    - id: 7-2-technical-decision-framework
      title: 7.2 Technical Decision Framework
      level: 3
      content: |-
        - [ ] Decision criteria for technical choices provided
        - [ ] Trade-offs articulated for key decisions
        - [ ] Rationale for selecting primary approach over considered alternatives documented (for key design/feature choices)
        - [ ] Non-negotiable technical requirements highlighted
        - [ ] Areas requiring technical investigation identified
        - [ ] Guidance on technical debt approach provided
    - id: 7-3-implementation-considerations
      title: 7.3 Implementation Considerations
      level: 3
      content: |-
        - [ ] Development approach guidance provided
        - [ ] Testing requirements articulated
        - [ ] Deployment expectations set
        - [ ] Monitoring needs identified
        - [ ] Documentation requirements specified
  - id: 8-cross-functional-requirements
    title: 8. CROSS-FUNCTIONAL REQUIREMENTS
    level: 2
    sections:
    - id: 8-1-data-requirements
      title: 8.1 Data Requirements
      level: 3
      content: |-
        - [ ] Data entities and relationships identified
        - [ ] Data storage requirements specified
        - [ ] Data quality requirements defined
        - [ ] Data retention policies identified
        - [ ] Data migration needs addressed (if applicable)
        - [ ] Schema changes planned iteratively, tied to stories requiring them
    - id: 8-2-integration-requirements
      title: 8.2 Integration Requirements
      level: 3
      content: |-
        - [ ] External system integrations identified
        - [ ] API requirements documented
        - [ ] Authentication for integrations specified
        - [ ] Data exchange formats defined
        - [ ] Integration testing requirements outlined
    - id: 8-3-operational-requirements
      title: 8.3 Operational Requirements
      level: 3
      content: |-
        - [ ] Deployment frequency expectations set
        - [ ] Environment requirements defined
        - [ ] Monitoring and alerting needs identified
        - [ ] Support requirements documented
        - [ ] Performance monitoring approach specified
  - id: 9-clarity-communication
    title: 9. CLARITY & COMMUNICATION
    level: 2
    sections:
    - id: 9-1-documentation-quality
      title: 9.1 Documentation Quality
      level: 3
      content: |-
        - [ ] Documents use clear, consistent language
        - [ ] Documents are well-structured and organized
        - [ ] Technical terms are defined where necessary
        - [ ] Diagrams/visuals included where helpful
        - [ ] Documentation is versioned appropriately
    - id: 9-2-stakeholder-alignment
      title: 9.2 Stakeholder Alignment
      level: 3
      content: |-
        - [ ] Key stakeholders identified
        - [ ] Stakeholder input incorporated
        - [ ] Potential areas of disagreement addressed
        - [ ] Communication plan for updates established
        - [ ] Approval process defined
  - id: prd-epic-validation-summary
    title: PRD & EPIC VALIDATION SUMMARY
    level: 2
    content: |-
      [[LLM: FINAL PM CHECKLIST REPORT GENERATION

      Create a comprehensive validation report that includes:

      1. Executive Summary
         - Overall PRD completeness (percentage)
         - MVP scope appropriateness (Too Large/Just Right/Too Small)
         - Readiness for architecture phase (Ready/Nearly Ready/Not Ready)
         - Most critical gaps or concerns

      2. Category Analysis Table
         Fill in the actual table with:
         - Status: PASS (90%+ complete), PARTIAL (60-89%), FAIL (<60%)
         - Critical Issues: Specific problems that block progress

      3. Top Issues by Priority
         - BLOCKERS: Must fix before architect can proceed
         - HIGH: Should fix for quality
         - MEDIUM: Would improve clarity
         - LOW: Nice to have

      4. MVP Scope Assessment
         - Features that might be cut for true MVP
         - Missing features that are essential
         - Complexity concerns
         - Timeline realism

      5. Technical Readiness
         - Clarity of technical constraints
         - Identified technical risks
         - Areas needing architect investigation

      6. Recommendations
         - Specific actions to address each blocker
         - Suggested improvements
         - Next steps

      After presenting the report, ask if the user wants:

      - Detailed analysis of any failed sections
      - Suggestions for improving specific areas
      - Help with refining MVP scope]]
    sections:
    - id: category-statuses
      title: Category Statuses
      level: 3
      content: |-
        | Category                         | Status | Critical Issues |
        | -------------------------------- | ------ | --------------- |
        | 1. Problem Definition & Context  | _TBD_  |                 |
        | 2. MVP Scope Definition          | _TBD_  |                 |
        | 3. User Experience Requirements  | _TBD_  |                 |
        | 4. Functional Requirements       | _TBD_  |                 |
        | 5. Non-Functional Requirements   | _TBD_  |                 |
        | 6. Epic & Story Structure        | _TBD_  |                 |
        | 7. Technical Guidance            | _TBD_  |                 |
        | 8. Cross-Functional Requirements | _TBD_  |                 |
        | 9. Clarity & Communication       | _TBD_  |                 |
    - id: critical-deficiencies
      title: Critical Deficiencies
      level: 3
      content: (To be populated during validation)
    - id: recommendations
      title: Recommendations
      level: 3
      content: (To be populated during validation)
    - id: final-decision
      title: Final Decision
      level: 3
      content: |-
        - **READY FOR ARCHITECT**: The PRD and epics are comprehensive, properly structured, and ready for architectural design.
        - **NEEDS REFINEMENT**: The requirements documentation requires additional work to address the identified deficiencies.
