title: Create Brownfield Story Task
version: 1
source_path: new_langgraph/lib/tasks/brownfield-create-story.yaml
summary: Create a single user story for very small brownfield enhancements that can
  be completed in one focused development session. This task is for minimal additions
  or bug fixes that require existing system integration awareness.
