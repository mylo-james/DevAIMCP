sections:
- id: qa-gate
  title: qa-gate
  level: 1
  content: Create or update a quality gate decision file for a story based on review
    findings.
  sections:
  - id: purpose
    title: Purpose
    level: 2
    content: Generate a standalone quality gate file that provides a clear pass/fail
      decision with actionable feedback. This gate serves as an advisory checkpoint
      for teams to understand quality status.
  - id: prerequisites
    title: Prerequisites
    level: 2
    content: |-
      - Story has been reviewed (manually or via review-story task)
      - Review findings are available
      - Understanding of story requirements and implementation
  - id: gate-file-location
    title: Gate File Location
    level: 2
    content: |-
      **ALWAYS** check the `bmad-core/core-config.yaml` for the `qa.qaLocation/gates`

      Slug rules:

      - Convert to lowercase
      - Replace spaces with hyphens
      - Strip punctuation
      - Example: "User Auth - Login!" becomes "user-auth-login"
  - id: minimal-required-schema
    title: Minimal Required Schema
    level: 2
    content: |-
      ```yaml
      schema: 1
      story: '{epic}.{story}'
      gate: PASS|CONCERNS|FAIL|WAIVED
      status_reason: '1-2 sentence explanation of gate decision'
      reviewer: 'Quinn'
      updated: '{ISO-8601 timestamp}'
      top_issues: [] # Empty array if no issues
      waiver: { active: false } # Only set active: true if WAIVED
      ```
  - id: schema-with-issues
    title: Schema with Issues
    level: 2
    content: |-
      ```yaml
      schema: 1
      story: '1.3'
      gate: CONCERNS
      status_reason: 'Missing rate limiting on auth endpoints poses security risk.'
      reviewer: 'Quinn'
      updated: '2025-01-12T10:15:00Z'
      top_issues:
        - id: 'SEC-001'
          severity: high # ONLY: low|medium|high
          finding: 'No rate limiting on login endpoint'
          suggested_action: 'Add rate limiting middleware before production'
        - id: 'TEST-001'
          severity: medium
          finding: 'No integration tests for auth flow'
          suggested_action: 'Add integration test coverage'
      waiver: { active: false }
      ```
  - id: schema-when-waived
    title: Schema when Waived
    level: 2
    content: |-
      ```yaml
      schema: 1
      story: '1.3'
      gate: WAIVED
      status_reason: 'Known issues accepted for MVP release.'
      reviewer: 'Quinn'
      updated: '2025-01-12T10:15:00Z'
      top_issues:
        - id: 'PERF-001'
          severity: low
          finding: 'Dashboard loads slowly with 1000+ items'
          suggested_action: 'Implement pagination in next sprint'
      waiver:
        active: true
        reason: 'MVP release - performance optimization deferred'
        approved_by: 'Product Owner'
      ```
  - id: gate-decision-criteria
    title: Gate Decision Criteria
    level: 2
    sections:
    - id: pass
      title: PASS
      level: 3
      content: |-
        - All acceptance criteria met
        - No high-severity issues
        - Test coverage meets project standards
    - id: concerns
      title: CONCERNS
      level: 3
      content: |-
        - Non-blocking issues present
        - Should be tracked and scheduled
        - Can proceed with awareness
    - id: fail
      title: FAIL
      level: 3
      content: |-
        - Acceptance criteria not met
        - High-severity issues present
        - Recommend return to InProgress
    - id: waived
      title: WAIVED
      level: 3
      content: |-
        - Issues explicitly accepted
        - Requires approval and reason
        - Proceed despite known issues
  - id: severity-scale
    title: Severity Scale
    level: 2
    content: |-
      **FIXED VALUES - NO VARIATIONS:**

      - `low`: Minor issues, cosmetic problems
      - `medium`: Should fix soon, not blocking
      - `high`: Critical issues, should block release
  - id: issue-id-prefixes
    title: Issue ID Prefixes
    level: 2
    content: |-
      - `SEC-`: Security issues
      - `PERF-`: Performance issues
      - `REL-`: Reliability issues
      - `TEST-`: Testing gaps
      - `MNT-`: Maintainability concerns
      - `ARCH-`: Architecture issues
      - `DOC-`: Documentation gaps
      - `REQ-`: Requirements issues
  - id: output-requirements
    title: Output Requirements
    level: 2
    content: |-
      1. **ALWAYS** create gate file at: `qa.qaLocation/gates` from `bmad-core/core-config.yaml`
      2. **ALWAYS** append this exact format to story's QA Results section:

         ```text
         Gate: {STATUS} → qa.qaLocation/gates/{epic}.{story}-{slug}.yml
         ```

      3. Keep status_reason to 1-2 sentences maximum
      4. Use severity values exactly: `low`, `medium`, or `high`
  - id: example-story-update
    title: Example Story Update
    level: 2
    content: |-
      After creating gate file, append to story's QA Results section:

      ```markdown
  - id: qa-results
    title: QA Results
    level: 2
    sections:
    - id: review-date-2025-01-12
      title: 'Review Date: 2025-01-12'
      level: 3
    - id: reviewed-by-quinn-test-architect
      title: 'Reviewed By: Quinn (Test Architect)'
      level: 3
      content: '[... existing review content ...]'
    - id: gate-status
      title: Gate Status
      level: 3
      content: |-
        Gate: CONCERNS → qa.qaLocation/gates/{epic}.{story}-{slug}.yml
        ```
  - id: key-principles
    title: Key Principles
    level: 2
    content: |-
      - Keep it minimal and predictable
      - Fixed severity scale (low/medium/high)
      - Always write to standard path
      - Always update story with gate reference
      - Clear, actionable findings
