sections:
- id: create-deep-research-prompt-task
  title: Create Deep Research Prompt Task
  level: 1
  content: This task helps create comprehensive research prompts for various types
    of deep analysis. It can process inputs from brainstorming sessions, project briefs,
    market research, or specific research questions to generate targeted prompts for
    deeper investigation.
  sections:
  - id: purpose
    title: Purpose
    level: 2
    content: |-
      Generate well-structured research prompts that:

      - Define clear research objectives and scope
      - Specify appropriate research methodologies
      - Outline expected deliverables and formats
      - Guide systematic investigation of complex topics
      - Ensure actionable insights are captured
  - id: research-type-selection
    title: Research Type Selection
    level: 2
    content: 'CRITICAL: First, help the user select the most appropriate research
      focus based on their needs and any input documents they''ve provided.'
    sections:
    - id: 1-research-focus-options
      title: 1. Research Focus Options
      level: 3
      content: |-
        Present these numbered options to the user:

        1. **Product Validation Research**
           - Validate product hypotheses and market fit
           - Test assumptions about user needs and solutions
           - Assess technical and business feasibility
           - Identify risks and mitigation strategies

        2. **Market Opportunity Research**
           - Analyze market size and growth potential
           - Identify market segments and dynamics
           - Assess market entry strategies
           - Evaluate timing and market readiness

        3. **User & Customer Research**
           - Deep dive into user personas and behaviors
           - Understand jobs-to-be-done and pain points
           - Map customer journeys and touchpoints
           - Analyze willingness to pay and value perception

        4. **Competitive Intelligence Research**
           - Detailed competitor analysis and positioning
           - Feature and capability comparisons
           - Business model and strategy analysis
           - Identify competitive advantages and gaps

        5. **Technology & Innovation Research**
           - Assess technology trends and possibilities
           - Evaluate technical approaches and architectures
           - Identify emerging technologies and disruptions
           - Analyze build vs. buy vs. partner options

        6. **Industry & Ecosystem Research**
           - Map industry value chains and dynamics
           - Identify key players and relationships
           - Analyze regulatory and compliance factors
           - Understand partnership opportunities

        7. **Strategic Options Research**
           - Evaluate different strategic directions
           - Assess business model alternatives
           - Analyze go-to-market strategies
           - Consider expansion and scaling paths

        8. **Risk & Feasibility Research**
           - Identify and assess various risk factors
           - Evaluate implementation challenges
           - Analyze resource requirements
           - Consider regulatory and legal implications

        9. **Custom Research Focus**
           - User-defined research objectives
           - Specialized domain investigation
           - Cross-functional research needs
    - id: 2-input-processing
      title: 2. Input Processing
      level: 3
      content: |-
        **If Project Brief provided:**

        - Extract key product concepts and goals
        - Identify target users and use cases
        - Note technical constraints and preferences
        - Highlight uncertainties and assumptions

        **If Brainstorming Results provided:**

        - Synthesize main ideas and themes
        - Identify areas needing validation
        - Extract hypotheses to test
        - Note creative directions to explore

        **If Market Research provided:**

        - Build on identified opportunities
        - Deepen specific market insights
        - Validate initial findings
        - Explore adjacent possibilities

        **If Starting Fresh:**

        - Gather essential context through questions
        - Define the problem space
        - Clarify research objectives
        - Establish success criteria
  - id: process
    title: Process
    level: 2
    sections:
    - id: 3-research-prompt-structure
      title: 3. Research Prompt Structure
      level: 3
      content: 'CRITICAL: collaboratively develop a comprehensive research prompt
        with these components.'
      sections:
      - id: a-research-objectives
        title: A. Research Objectives
        level: 4
        content: |-
          CRITICAL: collaborate with the user to articulate clear, specific objectives for the research.

          - Primary research goal and purpose
          - Key decisions the research will inform
          - Success criteria for the research
          - Constraints and boundaries
      - id: b-research-questions
        title: B. Research Questions
        level: 4
        content: |-
          CRITICAL: collaborate with the user to develop specific, actionable research questions organized by theme.

          **Core Questions:**

          - Central questions that must be answered
          - Priority ranking of questions
          - Dependencies between questions

          **Supporting Questions:**

          - Additional context-building questions
          - Nice-to-have insights
          - Future-looking considerations
      - id: c-research-methodology
        title: C. Research Methodology
        level: 4
        content: |-
          **Data Collection Methods:**

          - Secondary research sources
          - Primary research approaches (if applicable)
          - Data quality requirements
          - Source credibility criteria

          **Analysis Frameworks:**

          - Specific frameworks to apply
          - Comparison criteria
          - Evaluation methodologies
          - Synthesis approaches
      - id: d-output-requirements
        title: D. Output Requirements
        level: 4
        content: |-
          **Format Specifications:**

          - Executive summary requirements
          - Detailed findings structure
          - Visual/tabular presentations
          - Supporting documentation

          **Key Deliverables:**

          - Must-have sections and insights
          - Decision-support elements
          - Action-oriented recommendations
          - Risk and uncertainty documentation
    - id: 4-prompt-generation
      title: 4. Prompt Generation
      level: 3
      content: |-
        **Research Prompt Template:**

        ```markdown
  - id: research-objective
    title: Research Objective
    level: 2
    content: '[Clear statement of what this research aims to achieve]'
  - id: background-context
    title: Background Context
    level: 2
    content: '[Relevant information from project brief, brainstorming, or other inputs]'
  - id: research-questions
    title: Research Questions
    level: 2
    sections:
    - id: primary-questions-must-answer
      title: Primary Questions (Must Answer)
      level: 3
      content: |-
        1. [Specific, actionable question]
        2. [Specific, actionable question]
           ...
    - id: secondary-questions-nice-to-have
      title: Secondary Questions (Nice to Have)
      level: 3
      content: |-
        1. [Supporting question]
        2. [Supporting question]
           ...
  - id: research-methodology
    title: Research Methodology
    level: 2
    sections:
    - id: information-sources
      title: Information Sources
      level: 3
      content: '- [Specific source types and priorities]'
    - id: analysis-frameworks
      title: Analysis Frameworks
      level: 3
      content: '- [Specific frameworks to apply]'
    - id: data-requirements
      title: Data Requirements
      level: 3
      content: '- [Quality, recency, credibility needs]'
  - id: expected-deliverables
    title: Expected Deliverables
    level: 2
    sections:
    - id: executive-summary
      title: Executive Summary
      level: 3
      content: |-
        - Key findings and insights
        - Critical implications
        - Recommended actions
    - id: detailed-analysis
      title: Detailed Analysis
      level: 3
      content: '[Specific sections needed based on research type]'
    - id: supporting-materials
      title: Supporting Materials
      level: 3
      content: |-
        - Data tables
        - Comparison matrices
        - Source documentation
  - id: success-criteria
    title: Success Criteria
    level: 2
    content: '[How to evaluate if research achieved its objectives]'
  - id: timeline-and-priority
    title: Timeline and Priority
    level: 2
    content: |-
      [If applicable, any time constraints or phasing]
      ```
    sections:
    - id: 5-review-and-refinement
      title: 5. Review and Refinement
      level: 3
      content: |-
        1. **Present Complete Prompt**
           - Show the full research prompt
           - Explain key elements and rationale
           - Highlight any assumptions made

        2. **Gather Feedback**
           - Are the objectives clear and correct?
           - Do the questions address all concerns?
           - Is the scope appropriate?
           - Are output requirements sufficient?

        3. **Refine as Needed**
           - Incorporate user feedback
           - Adjust scope or focus
           - Add missing elements
           - Clarify ambiguities
    - id: 6-next-steps-guidance
      title: 6. Next Steps Guidance
      level: 3
      content: |-
        **Execution Options:**

        1. **Use with AI Research Assistant**: Provide this prompt to an AI model with research capabilities
        2. **Guide Human Research**: Use as a framework for manual research efforts
        3. **Hybrid Approach**: Combine AI and human research using this structure

        **Integration Points:**

        - How findings will feed into next phases
        - Which team members should review results
        - How to validate findings
        - When to revisit or expand research
  - id: important-notes
    title: Important Notes
    level: 2
    content: |-
      - The quality of the research prompt directly impacts the quality of insights gathered
      - Be specific rather than general in research questions
      - Consider both current state and future implications
      - Balance comprehensiveness with focus
      - Document assumptions and limitations clearly
      - Plan for iterative refinement based on initial findings
