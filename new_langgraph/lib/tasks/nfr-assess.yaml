sections:
- id: nfr-assess
  title: nfr-assess
  level: 1
  content: 'Quick NFR validation focused on the core four: security, performance,
    reliability, maintainability.'
  sections:
  - id: inputs
    title: Inputs
    level: 2
    content: |-
      ```yaml
      required:
        - story_id: '{epic}.{story}' # e.g., "1.3"
        - story_path: `bmad-core/core-config.yaml` for the `devStoryLocation`

      optional:
        - architecture_refs: `bmad-core/core-config.yaml` for the `architecture.architectureFile`
        - technical_preferences: `bmad-core/core-config.yaml` for the `technicalPreferences`
        - acceptance_criteria: From story file
      ```
  - id: purpose
    title: Purpose
    level: 2
    content: |-
      Assess non-functional requirements for a story and generate:

      1. YAML block for the gate file's `nfr_validation` section
      2. Brief markdown assessment saved to `qa.qaLocation/assessments/{epic}.{story}-nfr-{YYYYMMDD}.yaml`
  - id: process
    title: Process
    level: 2
    sections:
    - id: 0-fail-safe-for-missing-inputs
      title: 0. Fail-safe for Missing Inputs
      level: 3
      content: |-
        If story_path or story file can't be found:

        - Still create assessment file with note: "Source story not found"
        - Set all selected NFRs to CONCERNS with notes: "Target unknown / evidence missing"
        - Continue with assessment to provide value
    - id: 1-elicit-scope
      title: 1. Elicit Scope
      level: 3
      content: |-
        **Interactive mode:** Ask which NFRs to assess
        **Non-interactive mode:** Default to core four (security, performance, reliability, maintainability)

        ```text
        Which NFRs should I assess? (Enter numbers or press Enter for default)
        [1] Security (default)
        [2] Performance (default)
        [3] Reliability (default)
        [4] Maintainability (default)
        [5] Usability
        [6] Compatibility
        [7] Portability
        [8] Functional Suitability

        > [Enter for 1-4]
        ```
    - id: 2-check-for-thresholds
      title: 2. Check for Thresholds
      level: 3
      content: |-
        Look for NFR requirements in:

        - Story acceptance criteria
        - `docs/architecture/*.yaml` files
        - `docs/technical-preferences.yaml`

        **Interactive mode:** Ask for missing thresholds
        **Non-interactive mode:** Mark as CONCERNS with "Target unknown"

        ```text
        No performance requirements found. What's your target response time?
        > 200ms for API calls

        No security requirements found. Required auth method?
        > JWT with refresh tokens
        ```

        **Unknown targets policy:** If a target is missing and not provided, mark status as CONCERNS with notes: "Target unknown"
    - id: 3-quick-assessment
      title: 3. Quick Assessment
      level: 3
      content: |-
        For each selected NFR, check:

        - Is there evidence it's implemented?
        - Can we validate it?
        - Are there obvious gaps?
    - id: 4-generate-outputs
      title: 4. Generate Outputs
      level: 3
  - id: output-1-gate-yaml-block
    title: 'Output 1: Gate YAML Block'
    level: 2
    content: |-
      Generate ONLY for NFRs actually assessed (no placeholders):

      ```yaml
- id: gate-yaml-copy-paste
  title: 'Gate YAML (copy/paste):'
  level: 1
  content: |-
    nfr_validation:
      _assessed: [security, performance, reliability, maintainability]
      security:
        status: CONCERNS
        notes: 'No rate limiting on auth endpoints'
      performance:
        status: PASS
        notes: 'Response times < 200ms verified'
      reliability:
        status: PASS
        notes: 'Error handling and retries implemented'
      maintainability:
        status: CONCERNS
        notes: 'Test coverage at 65%, target is 80%'
    ```
  sections:
  - id: deterministic-status-rules
    title: Deterministic Status Rules
    level: 2
    content: |-
      - **FAIL**: Any selected NFR has critical gap or target clearly not met
      - **CONCERNS**: No FAILs, but any NFR is unknown/partial/missing evidence
      - **PASS**: All selected NFRs meet targets with evidence
  - id: quality-score-calculation
    title: Quality Score Calculation
    level: 2
    content: |-
      ```
      quality_score = 100
      - 20 for each FAIL attribute
      - 10 for each CONCERNS attribute
      Floor at 0, ceiling at 100
      ```

      If `technical-preferences.yaml` defines custom weights, use those instead.
  - id: output-2-brief-assessment-report
    title: 'Output 2: Brief Assessment Report'
    level: 2
    content: |-
      **ALWAYS save to:** `qa.qaLocation/assessments/{epic}.{story}-nfr-{YYYYMMDD}.yaml`

      ```markdown
- id: nfr-assessment-epic-story
  title: 'NFR Assessment: {epic}.{story}'
  level: 1
  content: |-
    Date: {date}
    Reviewer: Quinn
  sections:
  - id: summary
    title: Summary
    level: 2
    content: |-
      - Security: CONCERNS - Missing rate limiting
      - Performance: PASS - Meets <200ms requirement
      - Reliability: PASS - Proper error handling
      - Maintainability: CONCERNS - Test coverage below target
  - id: critical-issues
    title: Critical Issues
    level: 2
    content: |-
      1. **No rate limiting** (Security)
         - Risk: Brute force attacks possible
         - Fix: Add rate limiting middleware to auth endpoints

      2. **Test coverage 65%** (Maintainability)
         - Risk: Untested code paths
         - Fix: Add tests for uncovered branches
  - id: quick-wins
    title: Quick Wins
    level: 2
    content: |-
      - Add rate limiting: ~2 hours
      - Increase test coverage: ~4 hours
      - Add performance monitoring: ~1 hour
      ```
  - id: output-3-story-update-line
    title: 'Output 3: Story Update Line'
    level: 2
    content: |-
      **End with this line for the review task to quote:**

      ```
      NFR assessment: qa.qaLocation/assessments/{epic}.{story}-nfr-{YYYYMMDD}.yaml
      ```
  - id: output-4-gate-integration-line
    title: 'Output 4: Gate Integration Line'
    level: 2
    content: |-
      **Always print at the end:**

      ```
      Gate NFR block ready → paste into qa.qaLocation/gates/{epic}.{story}-{slug}.yml under nfr_validation
      ```
  - id: assessment-criteria
    title: Assessment Criteria
    level: 2
    sections:
    - id: security
      title: Security
      level: 3
      content: |-
        **PASS if:**

        - Authentication implemented
        - Authorization enforced
        - Input validation present
        - No hardcoded secrets

        **CONCERNS if:**

        - Missing rate limiting
        - Weak encryption
        - Incomplete authorization

        **FAIL if:**

        - No authentication
        - Hardcoded credentials
        - SQL injection vulnerabilities
    - id: performance
      title: Performance
      level: 3
      content: |-
        **PASS if:**

        - Meets response time targets
        - No obvious bottlenecks
        - Reasonable resource usage

        **CONCERNS if:**

        - Close to limits
        - Missing indexes
        - No caching strategy

        **FAIL if:**

        - Exceeds response time limits
        - Memory leaks
        - Unoptimized queries
    - id: reliability
      title: Reliability
      level: 3
      content: |-
        **PASS if:**

        - Error handling present
        - Graceful degradation
        - Retry logic where needed

        **CONCERNS if:**

        - Some error cases unhandled
        - No circuit breakers
        - Missing health checks

        **FAIL if:**

        - No error handling
        - Crashes on errors
        - No recovery mechanisms
    - id: maintainability
      title: Maintainability
      level: 3
      content: |-
        **PASS if:**

        - Test coverage meets target
        - Code well-structured
        - Documentation present

        **CONCERNS if:**

        - Test coverage below target
        - Some code duplication
        - Missing documentation

        **FAIL if:**

        - No tests
        - Highly coupled code
        - No documentation
  - id: quick-reference
    title: Quick Reference
    level: 2
    sections:
    - id: what-to-check
      title: What to Check
      level: 3
      content: |-
        ```yaml
        security:
          - Authentication mechanism
          - Authorization checks
          - Input validation
          - Secret management
          - Rate limiting

        performance:
          - Response times
          - Database queries
          - Caching usage
          - Resource consumption

        reliability:
          - Error handling
          - Retry logic
          - Circuit breakers
          - Health checks
          - Logging

        maintainability:
          - Test coverage
          - Code structure
          - Documentation
          - Dependencies
        ```
  - id: key-principles
    title: Key Principles
    level: 2
    content: |-
      - Focus on the core four NFRs by default
      - Quick assessment, not deep analysis
      - Gate-ready output format
      - Brief, actionable findings
      - Skip what doesn't apply
      - Deterministic status rules for consistency
      - Unknown targets → CONCERNS, not guesses

      ---
  - id: appendix-iso-25010-reference
    title: 'Appendix: ISO 25010 Reference'
    level: 2
    content: |-
      <details>
      <summary>Full ISO 25010 Quality Model (click to expand)</summary>
    sections:
    - id: all-8-quality-characteristics
      title: All 8 Quality Characteristics
      level: 3
      content: |-
        1. **Functional Suitability**: Completeness, correctness, appropriateness
        2. **Performance Efficiency**: Time behavior, resource use, capacity
        3. **Compatibility**: Co-existence, interoperability
        4. **Usability**: Learnability, operability, accessibility
        5. **Reliability**: Maturity, availability, fault tolerance
        6. **Security**: Confidentiality, integrity, authenticity
        7. **Maintainability**: Modularity, reusability, testability
        8. **Portability**: Adaptability, installability

        Use these when assessing beyond the core four.

        </details>

        <details>
        <summary>Example: Deep Performance Analysis (click to expand)</summary>

        ```yaml
        performance_deep_dive:
          response_times:
            p50: 45ms
            p95: 180ms
            p99: 350ms
          database:
            slow_queries: 2
            missing_indexes: ['users.email', 'orders.user_id']
          caching:
            hit_rate: 0%
            recommendation: 'Add Redis for session data'
          load_test:
            max_rps: 150
            breaking_point: 200 rps
        ```

        </details>
