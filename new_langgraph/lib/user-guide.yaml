      sections:
      - id: web-ui-to-ide-transition
        title: Web UI to IDE Transition
        level: 4
        content: |-
          **Critical Transition Point**: Once the PO confirms document alignment, you must switch from web UI to IDE to begin the development workflow:

          1. **Copy Documents to Project**: Ensure `docs/prd.yaml` and `docs/architecture.yaml` are in your project's docs folder (or a custom location you can specify during installation)
          2. **Switch to IDE**: Open your project in your preferred Agentic IDE
          3. **Document Sharding**: Use the PO agent to shard the PRD and then the Architecture
          4. **Begin Development**: Start the Core Development Cycle that follows
      - id: planning-artifacts-standard-paths
        title: Planning Artifacts (Standard Paths)
        level: 4
        content: |-
          ```text
          PRD              → docs/prd.yaml
          Architecture     → docs/architecture.yaml
          Sharded Epics    → docs/epics/
          Sharded Stories  → docs/stories/
          QA Assessments   → docs/qa/assessments/
          QA Gates         → docs/qa/gates/
          ```
    - id: the-core-development-cycle-ide
      title: The Core Development Cycle (IDE)
      level: 3
      content: |-
        Once planning is complete and documents are sharded, BMad follows a structured development workflow:

        ```mermaid
        graph TD
            A["Development Phase Start"] --> B["SM: Reviews Previous Story Dev/QA Notes"]
            B --> B2["SM: Drafts Next Story from Sharded Epic + Architecture"]
            B2 --> S{"High-Risk Story? (Optional)"}
            S -->|Yes| T["QA: *risk + *design on Draft Story"]
            S -->|No| B3
            T --> U["Test Strategy & Risk Profile Created"]
            U --> B3{"PO: Validate Story Draft (Optional)"}
            B3 -->|Validation Requested| B4["PO: Validate Story Against Artifacts"]
            B3 -->|Skip Validation| C{"User Approval"}
            B4 --> C
            C -->|Approved| D["Dev: Sequential Task Execution"]
            C -->|Needs Changes| B2
            D --> E["Dev: Implement Tasks + Tests"]
            E --> V{"Mid-Dev QA Check? (Optional)"}
            V -->|Yes| W["QA: *trace or *nfr for Early Validation"]
            V -->|No| F
            W --> X["Dev: Address Coverage/NFR Gaps"]
            X --> F["Dev: Run All Validations"]
            F --> G["Dev: Mark Ready for Review + Add Notes"]
            G --> H{"User Verification"}
            H -->|Request QA Review| I["QA: Test Architect Review + Quality Gate"]
            H -->|Approve Without QA| M["IMPORTANT: Verify All Regression Tests and Linting are Passing"]
