---
version: v1
kind: task
id: answer_question
namespace: llm
persona_ref: persona:agent
template:
  format: jinja2
  user: "{{ inputs.question }}"
llm:
  params:
    response_prefix: "Override: "
stop:
  if:
    contains:
      - "Override:"
      - var: result.parsed.answer
  max_tokens: 128
output_schema:
  type: object
  properties:
    answer:
      type: string
  required:
    - answer
writes:
  state:
    question:
      var: inputs.question
    answer:
      var: result.parsed.answer
