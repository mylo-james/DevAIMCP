sections:
- id: working-in-the-brownfield-a-complete-guide
  title: 'Working in the Brownfield: A Complete Guide'
  level: 1
  sections:
  - id: critical-tip
    title: Critical Tip
    level: 2
    content: |-
      Regardless of what you plan for your existing project you want to start agentic coding with, producing contextual artifacts for agents is of the highest importance.

      If using Claude Code - it is recommended to use the document-project task with the architect to systematically produce important key artifacts for your codebase.

      Optionally you can product context information and understanding for your repo utilizing web agents like Gemini. If its already in github, you can provide the project URL in gemini and use the agents to help analyze or document the project with the team fullstack or the architect specific gem.

      If your project is too large, you can also flatten your codebase - which can make it easier to upload or use with some tools. You can read more about the optional tool in the [Flattener Guide](./flattener.yaml)
  - id: what-is-brownfield-development
    title: What is Brownfield Development?
    level: 2
    content: Brownfield development refers to adding features, fixing bugs, or modernizing
      existing software projects. Unlike greenfield (new) projects, brownfield work
      requires understanding existing code, respecting constraints, and ensuring new
      changes integrate seamlessly without breaking existing functionality.
  - id: when-to-use-bmad-for-brownfield
    title: When to Use BMad for Brownfield
    level: 2
    content: |-
      - Add significant new features to existing applications
      - Modernize legacy codebases
      - Integrate new technologies or services
      - Refactor complex systems
      - Fix bugs that require architectural understanding
      - Document undocumented systems
  - id: when-not-to-use-a-brownfield-flow
    title: When NOT to use a Brownfield Flow
    level: 2
    content: If you have just completed an MVP with BMad, and you want to continue
      with post-MVP, its easier to just talk to the PM and ask it to work with you
      to create a new epic to add into the PRD, shard out the epic, update any architecture
      documents with the architect, and just go from there.
  - id: the-complete-brownfield-workflow
    title: The Complete Brownfield Workflow
    level: 2
    content: |-
      Starting in the Web Option (potentially save some cost but a potentially more frustrating experience):

      1. **Follow the [<ins>User Guide - Installation</ins>](user-guide.yaml#installation) steps to setup your agent in the web.**
      2. **Generate a 'flattened' single file of your entire codebase** run: `npx bmad-method flatten`

      Starting in an IDE with large context and good models (Its important to use quality models for this process for the best results)

      1. In Claude Code or a similar IDE, select the architect agent and then use the \*document-project task. You will want to ensure you are validating and directing the agent to produce the best possible documents for LLMs to understand your code base, and not include any misleading or unnecessary info.
    sections:
    - id: choose-your-approach
      title: Choose Your Approach
      level: 3
      sections:
      - id: approach-a-prd-first-recommended-if-adding-very-large-and-complex-new-features-single-or-multiple-epics-or-massive-changes
        title: 'Approach A: PRD-First (Recommended if adding very large and complex
          new features, single or multiple epics or massive changes)'
        level: 4
        content: |-
          **Best for**: Large codebases, monorepos, or when you know exactly what you want to build

          1. **Create PRD First** to define requirements
          2. **Document only relevant areas** based on PRD needs
          3. **More efficient** - avoids documenting unused code
      - id: approach-b-document-first-good-for-smaller-projects
        title: 'Approach B: Document-First (Good for Smaller Projects)'
        level: 4
        content: |-
          **Best for**: Smaller codebases, unknown systems, or exploratory changes

          1. **Document entire system** first
          2. **Create PRD** with full context
          3. **More thorough** - captures everything
    - id: approach-a-prd-first-workflow-recommended
      title: 'Approach A: PRD-First Workflow (Recommended)'
      level: 3
      sections:
      - id: phase-1-define-requirements-first
        title: 'Phase 1: Define Requirements First'
        level: 4
        content: |-
          **In Gemini Web (with your flattened-codebase.xml uploaded):**

          ```bash
          @pm
          *create-brownfield-prd
          ```

          The PM will:

          - **Ask about your enhancement** requirements
          - **Explore the codebase** to understand current state
          - **Identify affected areas** that need documentation
          - **Create focused PRD** with clear scope

          **Key Advantage**: The PRD identifies which parts of your monorepo/large codebase actually need documentation!
      - id: phase-2-focused-documentation
        title: 'Phase 2: Focused Documentation'
        level: 4
        content: |-
          **Still in Gemini Web, now with PRD context:**

          ```bash
          @architect
          *document-project
          ```

          The architect will:

          - **Ask about your focus** if no PRD was provided
          - **Offer options**: Create PRD, provide requirements, or describe the enhancement
          - **Reference the PRD/description** to understand scope
          - **Focus on relevant modules** identified in PRD or your description
          - **Skip unrelated areas** to keep docs lean
          - **Generate ONE architecture document** for all environments

          The architect creates:

          - **One comprehensive architecture document** following fullstack-architecture template
          - **Covers all system aspects** in a single file
          - **Easy to copy and save** as `docs/architecture.yaml`
          - **Can be sharded later** in IDE if desired

          For example, if you say "Add payment processing to user service":

          - Documents only: user service, API endpoints, database schemas, payment integrations
          - Creates focused source tree showing only payment-related code paths
          - Skips: admin panels, reporting modules, unrelated microservices
    - id: approach-b-document-first-workflow
      title: 'Approach B: Document-First Workflow'
      level: 3
      sections:
      - id: phase-1-document-the-existing-system
        title: 'Phase 1: Document the Existing System'
        level: 4
        content: |-
          **Best Approach - Gemini Web with 1M+ Context**:

          1. **Go to Gemini Web** (gemini.google.com)
          2. **Upload your project**:
             - **Option A**: Paste your GitHub repository URL directly
             - **Option B**: Upload your flattened-codebase.xml file
          3. **Load the architect agent**: Upload `dist/agents/architect.txt`
          4. **Run documentation**: Type `*document-project`

          The architect will generate comprehensive documentation of everything.
      - id: phase-2-plan-your-enhancement
        title: 'Phase 2: Plan Your Enhancement'
        level: 4
        sections:
        - id: option-a-full-brownfield-workflow-recommended-for-major-changes
          title: 'Option A: Full Brownfield Workflow (Recommended for Major Changes)'
          level: 5
          content: |-
            **1. Create Brownfield PRD**:

            ```bash
            @pm
            *create-brownfield-prd
            ```

            The PM agent will:

            - **Analyze existing documentation** from Phase 1
            - **Request specific enhancement details** from you
            - **Assess complexity** and recommend approach
            - **Create epic/story structure** for the enhancement
            - **Identify risks and integration points**

            **How PM Agent Gets Project Context**:

            - In Gemini Web: Already has full project context from Phase 1 documentation
            - In IDE: Will ask "Please provide the path to your existing project documentation"

            **Key Prompts You'll Encounter**:

            - "What specific enhancement or feature do you want to add?"
            - "Are there any existing systems or APIs this needs to integrate with?"
            - "What are the critical constraints we must respect?"
            - "What is your timeline and team size?"

            **2. Create Brownfield Architecture**:

            ```bash
            @architect
            *create-brownfield-architecture
            ```

            The architect will:

            - **Review the brownfield PRD**
            - **Design integration strategy**
            - **Plan migration approach** if needed
            - **Identify technical risks**
            - **Define compatibility requirements**
        - id: option-b-quick-enhancement-for-focused-changes
          title: 'Option B: Quick Enhancement (For Focused Changes)'
          level: 5
          content: |-
            **For Single Epic Without Full PRD**:

            ```bash
            @pm
            *create-brownfield-epic
            ```

            Use when:

            - Enhancement is well-defined and isolated
            - Existing documentation is comprehensive
            - Changes don't impact multiple systems
            - You need quick turnaround

            **For Single Story**:

            ```bash
            @pm
            *create-brownfield-story
            ```

            Use when:

            - Bug fix or tiny feature
            - Very isolated change
            - No architectural impact
            - Clear implementation path
    - id: phase-3-validate-planning-artifacts
      title: 'Phase 3: Validate Planning Artifacts'
      level: 3
      content: |-
        ```bash
        @po
        *execute-checklist-po
        ```

        The PO ensures:

        - Compatibility with existing system
        - No breaking changes planned
        - Risk mitigation strategies in place
        - Clear integration approach
    - id: phase-4-save-and-shard-documents
      title: 'Phase 4: Save and Shard Documents'
      level: 3
      content: |-
        1. Save your PRD and Architecture as:
           docs/prd.yaml
           docs/architecture.yaml
           (Note: You can optionally prefix with 'brownfield-' if managing multiple versions)
        2. Shard your docs:
           In your IDE

           ```bash
           @po
           shard docs/prd.yaml
           ```

           ```bash
           @po
           shard docs/architecture.yaml
           ```
    - id: phase-5-transition-to-development
      title: 'Phase 5: Transition to Development'
      level: 3
      content: '**Follow the [<ins>Enhanced IDE Development Workflow</ins>](enhanced-ide-development-workflow.yaml)**'
  - id: brownfield-best-practices
    title: Brownfield Best Practices
    level: 2
    sections:
    - id: 1-always-document-first
      title: 1. Always Document First
      level: 3
      content: |-
        Even if you think you know the codebase:

        - Run `document-project` to capture current state
        - AI agents need this context
        - Discovers undocumented patterns
    - id: 2-respect-existing-patterns
      title: 2. Respect Existing Patterns
      level: 3
      content: |-
        The brownfield templates specifically look for:

        - Current coding conventions
        - Existing architectural patterns
        - Technology constraints
        - Team preferences
    - id: 3-plan-for-gradual-rollout
      title: 3. Plan for Gradual Rollout
      level: 3
      content: |-
        Brownfield changes should:

        - Support feature flags
        - Plan rollback strategies
        - Include migration scripts
        - Maintain backwards compatibility
    - id: 4-test-integration-thoroughly
      title: 4. Test Integration Thoroughly
      level: 3
      sections:
      - id: why-the-test-architect-is-critical-for-brownfield
        title: Why the Test Architect is Critical for Brownfield
        level: 4
        content: In brownfield projects, the Test Architect (Quinn) becomes your safety
          net against breaking existing functionality. Unlike greenfield where you're
          building fresh, brownfield requires careful validation that new changes
          don't destabilize what already works.
      - id: brownfield-specific-testing-challenges
        title: Brownfield-Specific Testing Challenges
        level: 4
        content: |-
          The Test Architect addresses unique brownfield complexities:

          | **Challenge**               | **How Test Architect Helps**                      | **Command**         |
          | --------------------------- | ------------------------------------------------- | ------------------- |
          | **Regression Risks**        | Identifies which existing features might break    | `*risk`             |
          | **Legacy Dependencies**     | Maps integration points and hidden dependencies   | `*trace`            |
          | **Performance Degradation** | Validates no slowdown in existing flows           | `*nfr`              |
          | **Coverage Gaps**           | Finds untested legacy code that new changes touch | `*design`           |
          | **Breaking Changes**        | Detects API/contract violations                   | `*review`           |
          | **Migration Safety**        | Validates data transformations and rollback plans | `*risk` + `*review` |
